              r.on("timeout", () => { r.destroy(); resolve(false); });
            });
          }

          function checkGatewayBusy() {
            return new Promise((resolve) => {
              const r = http.get(
                { hostname: "127.0.0.1", port: GW_API_PORT, path: "/health/detailed", headers: { authorization: `Bearer ${GW_SECRET}` }, timeout: 2000 },
                (res) => {
                  const chunks = [];
                  res.on("data", (c) => chunks.push(c));
                  res.on("end", () => {
                    try {
                      const j = JSON.parse(Buffer.concat(chunks).toString("utf8") || "{}");
                      const rd = j.readiness || {};
                      const busy = Boolean(
                        j.gateway_busy ||
                        Number(j.active_agents || 0) > 0 ||
                        Number(rd.active_api_runs || 0) > 0 ||
                        Number(rd.active_delegations || 0) > 0
                      );
                      resolve(busy);
                    } catch {
                      resolve(false);
                    }
                  });
                }
              );
              r.on("error", () => resolve(false));
              r.on("timeout", () => { r.destroy(); resolve(false); });
            });
