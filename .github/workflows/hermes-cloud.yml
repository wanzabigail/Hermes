          AI_BASE_URL_IN: ${{ inputs.ai_base_url }}
          AI_MODEL_IN: ${{ inputs.ai_model }}
          DURASI: ${{ inputs.durasi_menit }}
        run: |
          export FINAL_PW="$(printf '%s' "${INPUT_PW:-${SECRET_PW:-$FALLBACK_PW}}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          export WORKSPACE_DIR="$PWD"
          if [ -z "$FINAL_PW" ]; then
            echo "::error::Password belum diisi! Isi kolom 'password_login' saat klik Run workflow ATAU buat Secret HERMES_PASSWORD."
            exit 1
          fi
          echo "1" > /tmp/password_verified

          # 1. Pulihkan seluruh memori, sesi chat, skill, custom provider & .env dari enkripsi AES-256
          "$HOME/.local/bin/hermes-restore"

          # 2. Pastikan API Server Gateway :8642 & kredensial GitHub Secrets disuntikkan rapi ke ~/.hermes/.env
          GW_SECRET=$(printf '%s' "$FINAL_PW" | openssl dgst -sha256 -hmac "hermes-internal-gw" | awk '{print $2}')
          echo "$GW_SECRET" > /tmp/gw_secret.txt

          python3 - "$HOME/.hermes/.env" "$GW_SECRET" "$WORKSPACE_DIR" << 'PYENV'
          import os, sys
          env_file, gw_secret, ws_dir = sys.argv[1:4]
          os.makedirs(os.path.dirname(env_file), exist_ok=True)
          lines = open(env_file, encoding="utf-8").read().splitlines() if os.path.isfile(env_file) else []
          updates = {
              "API_SERVER_ENABLED": "true",
              "API_SERVER_HOST": "127.0.0.1",
              "API_SERVER_PORT": "8642",
              "API_SERVER_KEY": gw_secret,
          }
          for k in [
              "TELEGRAM_BOT_TOKEN", "TELEGRAM_ALLOWED_USERS",
              "DISCORD_BOT_TOKEN", "DISCORD_ALLOWED_USERS",
              "OPENROUTER_API_KEY", "GEMINI_API_KEY",
              "ANTHROPIC_API_KEY", "OPENAI_API_KEY", "NOUS_API_KEY",
          ]:
              v = os.environ.get(k, "").strip()
              if v:
                  updates[k] = v
          seen = set()
          out = []
          for line in lines:
              t = line.strip()
              if t and not t.startswith("#") and "=" in t:
                  k = t.split("=", 1)[0].strip()
                  if k in updates:
                      seen.add(k)
                      out.append(f"{k}={updates[k]}")
                      continue
              out.append(line)
          for k, v in updates.items():
              if k not in seen:
                  out.append(f"{k}={v}")
          open(env_file, "w", encoding="utf-8").write("\n".join(out) + "\n")
          os.chmod(env_file, 0o600)
          PYENV

          # 3. Set direktori kerja terminal & terapkan opsi AI Provider awal jika dipilih saat klik Run workflow
          "$HOME/.local/bin/hermes" config set terminal.cwd "$WORKSPACE_DIR" >/dev/null 2>&1 || true
          if [ "$AI_PROVIDER_IN" = "ollama-free-local" ]; then
            "$HOME/.local/bin/hermes" config set model.provider custom
            "$HOME/.local/bin/hermes" config set model.base_url "http://127.0.0.1:11434/v1"
            "$HOME/.local/bin/hermes" config set model.default "${AI_MODEL_IN:-qwen2.5-coder:3b}"
          elif [ "$AI_PROVIDER_IN" != "unchanged" ]; then
            "$HOME/.local/bin/hermes" config set model.provider "$AI_PROVIDER_IN"
            [ -n "$AI_BASE_URL_IN" ] && "$HOME/.local/bin/hermes" config set model.base_url "$AI_BASE_URL_IN"
            [ -n "$AI_MODEL_IN" ] && "$HOME/.local/bin/hermes" config set model.default "$AI_MODEL_IN"
          fi

          # 4. Konfigurasi koneksi Hermes Workspace (:3002) <-> Hermes Gateway (:8642) & Dashboard (:9119)
          cat << HWENV > /opt/hermes-workspace/.env
          HERMES_AGENT_PATH=$HOME/.hermes/hermes-agent
          HERMES_API_URL=http://127.0.0.1:8642
          HERMES_API_TOKEN=$GW_SECRET
          HERMES_DASHBOARD_URL=http://127.0.0.1:9119
          PORT=3002
          HOST=127.0.0.1
          HWENV

          START_MS=$(date +%s%3N)
          echo "$START_MS" > /tmp/start_ms.txt

          # 5. Nyalakan ke-4 layanan inti secara paralel (Gateway Bot + Official Dashboard + Modern Workspace + Cloud Proxy)
          env -u RUNNER_TRACKING_ID \
            nohup "$HOME/.local/bin/hermes" gateway run --replace --accept-hooks </dev/null >/tmp/hermes-gw.log 2>&1 &

          env -u RUNNER_TRACKING_ID \
            nohup "$HOME/.local/bin/hermes" dashboard --host 127.0.0.1 --port 9119 --no-open --skip-build </dev/null >/tmp/hermes-dash.log 2>&1 &

          (
            cd /opt/hermes-workspace
            if [ -f dist/server/server.js ]; then
              env -u RUNNER_TRACKING_ID HOST=127.0.0.1 PORT=3002 \
                nohup node server-entry.js </dev/null >/tmp/hermes-ws.log 2>&1 &
            else
              env -u RUNNER_TRACKING_ID \
                nohup pnpm exec vite dev --host 127.0.0.1 --port 3002 </dev/null >/tmp/hermes-ws.log 2>&1 &
            fi
          )

          env -u RUNNER_TRACKING_ID \
            HERMES_PASSWORD="$FINAL_PW" \
            WORKSPACE_DIR="$WORKSPACE_DIR" \
            START_TIME_MS="$START_MS" \
            DURASI_MENIT="$DURASI" \
            GW_SECRET="$GW_SECRET" \
            nohup node /tmp/hermes-proxy.mjs </dev/null >/tmp/hermes-proxy.log 2>&1 &

          for i in $(seq 1 20); do
            if curl -4 -fsS http://127.0.0.1:4096/__hm_health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          # 6. Buka Cloudflare Tunnel HTTPS Publik & update GitHub Pages + Notif
          env -u RUNNER_TRACKING_ID \
            nohup "$HOME/.local/bin/cloudflared" tunnel --no-autoupdate --protocol http2 --url http://127.0.0.1:4096 </dev/null >/tmp/cf.log 2>&1 &

          URL=""
          for i in $(seq 1 25); do
            URL=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' /tmp/cf.log | head -n 1 || true)
            [ -n "$URL" ] && break
            sleep 1
          done

          if [ -z "$URL" ]; then
            echo "::error::Gagal mendapatkan URL Cloudflare Tunnel."
            cat /tmp/cf.log
            exit 1
          fi

          for i in $(seq 1 20); do
            if curl -4 -fsS "$URL/__hm_health" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          "$HOME/.local/bin/hermes-publish-url" "$URL"
          PAGES_URL=$(cat /tmp/pages_url.txt 2>/dev/null || echo "")
