          sleep 2

          "$HOME/.local/bin/hermes-save" "chore: final auto-save otak & project Hermes"

      - name: 7. Lanjut Otomatis Sesi 6 Jam Berikutnya (Self-Healing 24/7 Nonstop)
        if: always() && !cancelled() && inputs.lanjut_otomatis == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/password_verified ]; then
            echo "Melewati auto-restart karena password belum diisi."
            exit 0
          fi
          for attempt in 1 2 3; do
            if gh workflow run hermes-cloud.yml \
              -f password_login="${{ inputs.password_login }}" \
              -f durasi_menit="${{ inputs.durasi_menit }}" \
              -f lanjut_otomatis=true \
              -f ai_provider=unchanged; then
              echo "✅ Sesi 6 jam Hermes berikutnya berhasil dijadwalkan otomatis!"
              break
            fi
            sleep 5
          done
