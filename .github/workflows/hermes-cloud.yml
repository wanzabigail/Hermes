              delete tHeaders["accept-encoding"];
              const tReq = http.request(
                { hostname: "127.0.0.1", port: TTYD_PORT, path: req.url, method: req.method, headers: tHeaders },
                (tRes) => {
                  const outH = { ...tRes.headers };
                  delete outH["access-control-allow-origin"];
                  const ctT = String(tRes.headers["content-type"] || "");
                  if (ctT.includes("text/html")) {
                    // Suntik baris tombol kontrol HP ke halaman terminal ttyd
                    delete outH["content-length"];
                    const chunks = [];
                    tRes.on("data", (c) => chunks.push(c));
                    tRes.on("end", () => {
                      let html = Buffer.concat(chunks).toString("utf8");
                      if (html.includes("<head>")) html = html.replace("<head>", "<head>" + TERM_WS_SHIM_JS);
                      if (html.includes("</body>")) html = html.replace("</body>", TERM_KEYBAR_JS + "</body>");
                      res.writeHead(tRes.statusCode || 200, outH);
                      res.end(html);
                    });
                  } else {
                    res.writeHead(tRes.statusCode || 200, outH);
                    tRes.pipe(res);
                  }
                }
              );
              tReq.on("error", (err) => {
                if (!res.headersSent) res.writeHead(502, { "content-type": "text/plain; charset=utf-8" });
                res.end("Terminal Hermes belum siap (ttyd mati?): " + err.message);
              });
              return req.pipe(tReq);
            }

            if (url.pathname === "/__mode") {
              const target = url.searchParams.get("to") === "dashboard" ? "dashboard" : "workspace";
              res.writeHead(302, {
                "Set-Cookie": `hm_surface=${target}; Path=/; Max-Age=2592000; SameSite=Lax`,
                "Location": "/",
                "cache-control": "no-store",
              });
              return res.end();
            }

            if (url.pathname === "/__hm_widget.js") {
              const surface = parseCookies(req.headers.cookie || "").hm_surface === "dashboard" ? "dashboard" : "workspace";
              res.writeHead(200, { "content-type": "application/javascript; charset=utf-8", "cache-control": "no-store" });
              return res.end(buildWidgetJs(surface));
            }

            if (url.pathname === "/__panel") {
              res.writeHead(200, { "content-type": "text/html; charset=utf-8", "cache-control": "no-store" });
              return res.end(PANEL_HTML);
            }

            // Endpoint OpenAI-Compatible langsung ke Hermes Gateway :8642
            if (url.pathname.startsWith("/v1/")) {
              const gReq = http.request(
                {
                  hostname: "127.0.0.1",
                  port: GW_API_PORT,
                  path: req.url,
                  method: req.method,
                  headers: {
                    ...req.headers,
                    host: `127.0.0.1:${GW_API_PORT}`,
                    authorization: `Bearer ${GW_SECRET}`,
                  },
                },
                (gRes) => {
                  res.writeHead(gRes.statusCode || 200, gRes.headers);
                  gRes.pipe(res);
                }
              );
              gReq.on("error", (e) => sendJson(res, 502, { error: "Hermes Gateway belum siap: " + e.message }));
              return req.pipe(gReq);
            }

            // 1A. Auto-Fetch Daftar Model (/v1/models)
            if (url.pathname === "/__api/ai-models" && req.method === "POST") {
              try {
                const d = JSON.parse((await readBody(req)) || "{}");
                const prov = String(d.provider || "custom").trim();
                const envMap = readEnvMap();
                const base = (String(d.baseUrl || "").trim() || PROVIDER_DEFAULT_URLS[prov] || "").replace(/\/+$/, "");
                const key = String(d.apiKey || "").trim() || envMap[ENV_MAP_BY_PROVIDER[prov] || "OPENAI_API_KEY"] || "";
                if (!base) return sendJson(res, 400, { error: "Isi Base URL terlebih dulu (misal https://openrouter.ai/api/v1)." });
                const hdrs = { accept: "application/json", "user-agent": String(d.userAgent || "curl/8.7.1").trim() };
                if (key) hdrs.authorization = `Bearer ${key}`;
                const r = await httpJsonRequest(`${base}/models`, { headers: hdrs });
                const j = JSON.parse(r.text || "{}");
                const list = Array.isArray(j.data) ? j.data.map((m) => m.id || m.name).filter(Boolean) : [];
                return sendJson(res, 200, { models: list.sort() });
              } catch (e) {
                return sendJson(res, 500, { error: "Gagal mengambil daftar model: " + e.message });
              }
            }

            // 1B. 1-Click Tes Ping AI 3-Tahap: (A) dasar -> (B) simulasi request asli Hermes
            // (tools + reasoning_effort medium) -> (C) tanpa reasoning. Auto-deteksi penyebab error 400.
            if (url.pathname === "/__api/ai-ping" && req.method === "POST") {
              try {
                const d = JSON.parse((await readBody(req)) || "{}");
                const prov = String(d.provider || "custom").trim();
                const envMap = readEnvMap();
                const base = (String(d.baseUrl || "").trim() || PROVIDER_DEFAULT_URLS[prov] || "").replace(/\/+$/, "");
                const key = String(d.apiKey || "").trim() || envMap[ENV_MAP_BY_PROVIDER[prov] || "OPENAI_API_KEY"] || "";
                const model = String(d.model || "").trim();
                if (!base || !model) return sendJson(res, 400, { error: "Isi Base URL dan Model ID terlebih dulu." });
                const hdrs = { "content-type": "application/json", "user-agent": String(d.userAgent || "curl/8.7.1").trim() };
                if (key) hdrs.authorization = `Bearer ${key}`;
                const t0 = Date.now();
                const rA = await httpJsonRequest(`${base}/chat/completions`, {
                  method: "POST",
                  headers: hdrs,
                  body: JSON.stringify({ model, messages: [{ role: "user", content: "Jawab singkat: OK" }], max_tokens: 16 }),
                });
                if (rA.status >= 300) {
                  return sendJson(res, 200, { error: `❌ Tes Dasar GAGAL (HTTP ${rA.status}, ${Date.now() - t0} ms): ${rA.text.slice(0, 180)}` });
                }
                const ms = Date.now() - t0;
                const simTools = [{ type: "function", function: { name: "check_status", description: "Cek status sistem", parameters: { type: "object", properties: {}, additionalProperties: false } } }];
                const rB = await httpJsonRequest(`${base}/chat/completions`, {
                  method: "POST",
                  headers: hdrs,
                  body: JSON.stringify({ model, messages: [{ role: "user", content: "Jawab singkat: OK" }], max_tokens: 16, reasoning_effort: "medium", tools: simTools }),
                });
                if (rB.status >= 200 && rB.status < 300) {
                  return sendJson(res, 200, { message: `⚡ Koneksi SEMPURNA (${ms} ms)! Key, model, tools & reasoning semuanya diterima provider — siap dipakai Hermes tanpa error.`, full: true });
                }
                const rC = await httpJsonRequest(`${base}/chat/completions`, {
                  method: "POST",
                  headers: hdrs,
                  body: JSON.stringify({ model, messages: [{ role: "user", content: "Jawab singkat: OK" }], max_tokens: 16, tools: simTools }),
                });
                if (rC.status >= 200 && rC.status < 300) {
                  return sendJson(res, 200, {
                    message: `⚠️ Masalah ketemu! Key & model valid (${ms} ms), TAPI provider menolak parameter reasoning (HTTP ${rB.status}) — inilah penyebab error "malformed / Invalid inference request" di Hermes. Klik tombol 🛡️ Perbaiki Otomatis di bawah, lalu coba chat lagi.`,
                    fixReasoning: true,
                  });
                }
                return sendJson(res, 200, { error: `❌ Model ini tampaknya TIDAK mendukung tools/function-calling (HTTP ${rC.status}): ${rC.text.slice(0, 160)} — Hermes butuh model yang support tools. Pilih model lain lewat 🔍 Ambil Daftar Model.` });
              } catch (e) {
                return sendJson(res, 500, { error: "❌ Gagal konek: " + e.message });
              }
            }

            // 1B2. 🔬 Forensik Error 400: baca dump request ASLI yang ditolak Hermes
            // dari ~/.hermes/sessions/request_dump_*.json + tes bertahap live untuk
            // menemukan parameter persis yang ditolak provider (reasoning/tools/max_tokens/etc).
            if (url.pathname === "/__api/ai-forensic" && req.method === "POST") {
              try {
                const d = JSON.parse((await readBody(req)) || "{}");
                const prov = String(d.provider || "custom").trim();
                const envMap = readEnvMap();
                const base = (String(d.baseUrl || "").trim() || PROVIDER_DEFAULT_URLS[prov] || "").replace(/\/+$/, "");
                const key = String(d.apiKey || "").trim() || envMap[ENV_MAP_BY_PROVIDER[prov] || "OPENAI_API_KEY"] || "";
                const model = String(d.model || "").trim();
                const out = { dump: null, stages: [], verdict: "", fixReasoning: false, fixMaxTokens: false, basicOk: null };

                // (1) Dump request asli yang ditolak
                try {
                  const sessDir = path.join(HERMES_DIR, "sessions");
                  const dumps = fs.readdirSync(sessDir)
                    .filter((f) => f.startsWith("request_dump") && f.endsWith(".json"))
                    .map((f) => { const fp = path.join(sessDir, f); const stt = fs.statSync(fp); return { fp, mtime: stt.mtimeMs, size: stt.size }; })
                    .sort((a, b) => b.mtime - a.mtime)
                    .slice(0, 5);
                  for (const cand of dumps) {
                    if (cand.size > 25 * 1024 * 1024) continue;
                    try {
                      const j = JSON.parse(fs.readFileSync(cand.fp, "utf8"));
                      const body = (j.request && j.request.body) || {};
                      const bodyStr = JSON.stringify(body);
                      const msgs = Array.isArray(body.messages) ? body.messages : [];
                      const tls = Array.isArray(body.tools) ? body.tools : [];
                      const extraKeys = Object.keys(body).filter((k) => !["model", "messages", "tools"].includes(k));
                      let reasoningSent = body.reasoning_effort !== undefined ? String(body.reasoning_effort) : "";
                      if (!reasoningSent && body.extra_body && body.extra_body.reasoning) reasoningSent = JSON.stringify(body.extra_body.reasoning);
                      let errMsg = "-";
                      try { errMsg = String((j.error && j.error.body && (j.error.body.message || j.error.body)) || j.error || "-"); } catch (e) { errMsg = String(j.error || "-"); }
                      out.dump = {
                        time: new Date(cand.mtime).toISOString().replace("T", " ").slice(0, 19),
                        url: String((j.request && j.request.url) || "-").slice(0, 120),
                        model: String(body.model || "-"),
                        messages: msgs.length,
                        tools: tls.length,
                        sizeKB: Math.round(bodyStr.length / 1024),
                        images: (bodyStr.match(/image_url/g) || []).length,
                        reasoningSent,
                        extraKeys,
                        errorStatus: j.error && j.error.status_code,
                        errorMessage: errMsg.slice(0, 220),
                      };
                      break;
                    } catch {}
                  }
                } catch {}

                // (2) Tes bertahap live
                if (base && model) {
                  const hdrs = { "content-type": "application/json", "user-agent": String(d.userAgent || "curl/8.7.1").trim() };
                  if (key) hdrs.authorization = `Bearer ${key}`;
                  const mkTools = (n) => Array.from({ length: n }, (_, i) => ({ type: "function", function: { name: "tool_" + i + "_check", description: "Tool dummy " + i + " untuk tes batas provider", parameters: { type: "object", properties: { a: { type: "string", description: "arg a" }, b: { type: "number" }, c: { type: "boolean" } }, required: ["a"], additionalProperties: false } } }));
                  const probe = async (label, extra) => {
                    try {
                      const r = await Promise.race([
                        httpJsonRequest(`${base}/chat/completions`, { method: "POST", headers: hdrs, body: JSON.stringify({ model, messages: [{ role: "user", content: "Jawab singkat: OK" }], max_tokens: 16, ...extra }) }),
                        new Promise((_, rej) => setTimeout(() => rej(new Error("timeout 25s")), 25000)),
                      ]);
                      const ok = r.status >= 200 && r.status < 300;
                      out.stages.push({ label, ok, status: r.status, detail: ok ? "" : String(r.text || "").slice(0, 140) });
                      return ok;
                    } catch (e) {
                      out.stages.push({ label, ok: false, status: 0, detail: String(e.message).slice(0, 140) });
                      return false;
                    }
                  };
                  const tools1 = mkTools(1);
                  const okA = await probe("A. Request dasar (key + model)", {});
                  out.basicOk = okA;
                  if (okA) {
                    const okB = await probe("B. + reasoning_effort medium + tools", { reasoning_effort: "medium", tools: tools1 });
                    const okC = await probe("C. + tools saja (tanpa reasoning)", { tools: tools1 });
                    if (!okB && okC) {
                      const okB2 = await probe("B2. + reasoning_effort high + tools", { reasoning_effort: "high", tools: tools1 });
                      out.fixReasoning = true;
                      out.reasoningHighWorks = okB2;
                    }
                    if (okC) {
                      await probe("D. + 40 tools (tes batas jumlah & skema)", { tools: mkTools(40) });
                    } else {
                      out.stages.push({ label: "D. dilewati (tools tidak didukung)", ok: null, status: 0, detail: "" });
                    }
                    await probe("E1. + temperature 0.7", { temperature: 0.7 });
                    const okE2 = await probe("E2. + max_tokens 8192", { max_tokens: 8192 });
                    if (!okE2) {
                      out.fixMaxTokens = await probe("E2b. + max_tokens 4096", { max_tokens: 4096 });
                    }
                    await probe("F. + system prompt besar ~108 KB (tes input limit)", { messages: [{ role: "system", content: "Uji batas input. ".repeat(6000) }, { role: "user", content: "Jawab singkat: OK" }] });
                    await probe("G. + stream true (mode streaming)", { stream: true });
                  }
                }

                // (3) Kesimpulan otomatis
                const st = (p) => out.stages.find((s) => s.label.startsWith(p));
                const parts = [];
                if (out.dump) {
                  parts.push("Dump asli: " + out.dump.messages + " pesan, " + out.dump.tools + " tools, " + out.dump.sizeKB + " KB" + (out.dump.images ? ", " + out.dump.images + " gambar" : "") + (out.dump.reasoningSent ? " — reasoning_effort MASIH TERKIRIM (" + out.dump.reasoningSent + ")" : " — tanpa reasoning_effort") + ", error HTTP " + out.dump.errorStatus + ".");
                } else {
                  parts.push("Dump request belum ditemukan di sessions/ — tes live di bawah jadi acuan utama.");
                }
                if (out.basicOk === false) {
                  parts.push("Request dasar pun GAGAL — periksa API Key / Model ID / Base URL (lihat stage A).");
                } else if (st("B.") && !st("B.").ok && st("C.") && st("C.").ok) {
                  parts.push(out.reasoningHighWorks
                    ? "Provider menolak reasoning level 'medium' tapi MENERIMA 'high' → set 🧠 Reasoning ke high, atau pakai 🛡️ Mode Kompatibel."
                    : "Provider menolak parameter reasoning → aktifkan 🛡️ Mode Kompatibel (tombol perbaiki di bawah).");
                } else if (st("C.") && !st("C.").ok) {
                  parts.push("Model menolak function-calling/tools → TIDAK cocok untuk Hermes (butuh tools). Ganti model.");
                }
                if (st("D.") && !st("D.").ok) parts.push("Provider menolak 40 tools / skema kompleks → batas jumlah tools; pilih model lain.");
                if (st("E1.") && !st("E1.").ok) parts.push("Provider menolak parameter temperature.");
                if (st("E2.") && !st("E2.").ok) parts.push(out.fixMaxTokens
                  ? "Provider menolak max_tokens 8192 tapi MENERIMA 4096 → klik 🛠️ perbaiki max_tokens."
                  : "Provider menolak field max_tokens sepenuhnya.");
                if (st("F.") && !st("F.").ok) parts.push("Input limit model kecil — prompt besar ditolak. Hermes selalu mengirim system prompt besar + puluhan tools → ganti model ber-konteks besar (min 32K).");
                if (st("G.") && !st("G.").ok) parts.push("Provider menolak mode streaming (stream:true).");
                if (out.basicOk === true && (!parts.length || (st("B.") && st("B.").ok && !out.dump))) {
                  parts.push("Semua parameter individual LULUS. Jika chat masih gagal, bandingkan dengan dump asli di atas — kemungkinan kombinasi ukuran request Hermes (tools + system prompt) melebihi limit, atau isi pesan spesifik (gambar/history) yang ditolak.");
                }
                out.verdict = parts.join("\n");
                return sendJson(res, 200, out);
              } catch (e) {
                return sendJson(res, 500, { error: "Forensik gagal: " + e.message });
              }
            }

            // 1C. Simpan AI Config (+ Opsional Simpan ke Multi-Profil AI)
            if (url.pathname === "/__api/ai-config" && req.method === "POST") {
              try {
                const data = JSON.parse((await readBody(req)) || "{}");
                applyAiConfigSync(data);
                if (data.profileName) {
                  const cfg = readPanelConfig();
                  const envMap = readEnvMap();
                  const prov = String(data.provider || "custom").trim();
                  const effectiveKey = String(data.apiKey || "").trim() || envMap[ENV_MAP_BY_PROVIDER[prov] || "OPENAI_API_KEY"] || "";
                  cfg.profiles = cfg.profiles.filter((p) => p.name !== data.profileName);
                  cfg.profiles.unshift({
                    id: crypto.randomBytes(4).toString("hex"),
                    name: String(data.profileName).trim(),
                    provider: prov,
                    baseUrl: String(data.baseUrl || "").trim(),
                    apiKey: effectiveKey,
                    model: String(data.model || "").trim(),
                    userAgent: String(data.userAgent || "").trim(),
                    reasoning: String(data.reasoning || "default").trim(),
                  });
                  writePanelConfig(cfg);
                }
                await restartHermesGateway(true);
                triggerBackgroundSave("chore: auto-save AI config & profil terenkripsi AES-256");
                return sendJson(res, 200, { message: `✅ Provider "${data.provider}" (${data.model || "default"}) aktif & tersimpan aman!` });
              } catch (e) {
                return sendJson(res, 500, { error: "Gagal menyimpan AI config: " + e.message });
              }
            }

            // 1D. Kelola Multi-Profil AI Tersimpan (1-Klik Switch / Hapus)
            if (url.pathname === "/__api/ai-profiles" && req.method === "POST") {
              try {
                const d = JSON.parse((await readBody(req)) || "{}");
                const cfg = readPanelConfig();
                if (d.action === "delete") {
                  cfg.profiles = cfg.profiles.filter((p) => p.id !== d.id);
                  writePanelConfig(cfg);
                  triggerBackgroundSave("chore: hapus profil AI");
                  return sendJson(res, 200, { message: "✅ Profil dihapus." });
                }
                if (d.action === "activate") {
                  const found = cfg.profiles.find((p) => p.id === d.id);
                  if (!found) return sendJson(res, 404, { error: "Profil tidak ditemukan." });
                  applyAiConfigSync(found);
                  await restartHermesGateway(true);
                  triggerBackgroundSave(`chore: aktifkan profil AI ${found.name}`);
                  return sendJson(res, 200, { message: `⚡ Profil "${found.name}" (${found.model || "default"}) sekarang AKTIF!` });
                }
              } catch (e) {
                return sendJson(res, 500, { error: e.message });
              }
            }

            // 2A. WhatsApp QR Pairing langsung di Browser (Tanpa Terminal!)
            if (url.pathname === "/__api/wa/start" && req.method === "POST") {
              try {
                const d = JSON.parse((await readBody(req)) || "{}");
                if (waPairState.proc) {
                  try { waPairState.proc.kill("SIGTERM"); } catch {}
                }
                const mode = d.mode === "bot" ? "bot" : "self-chat";
                const allow = String(d.allow || "").trim();
                const bridgeDir = path.join(HERMES_DIR, "hermes-agent/scripts/whatsapp-bridge");
                const bridgeJs = path.join(bridgeDir, "bridge.js");
                if (!fs.existsSync(bridgeJs)) {
                  return sendJson(res, 500, { error: "Script WhatsApp bridge Hermes tidak ditemukan." });
                }
                waPairState = { status: "starting", qrSvg: "", message: "⏳ Menyiapkan jembatan WhatsApp (pertama kali ~8 detik)...", user: null, proc: null, mode, allow };

                setImmediate(() => {
                  try {
                    if (!fs.existsSync(path.join(bridgeDir, "node_modules"))) {
                      execSync("npm install --no-audit --no-fund", { cwd: bridgeDir, stdio: "ignore", timeout: 90000 });
                    }
                    fs.mkdirSync(WA_SESSION_DIR, { recursive: true });
                    const proc = spawn("node", [bridgeJs, "--pair-only", "--pair-json", "--port", "3099", "--session", WA_SESSION_DIR], {
                      cwd: bridgeDir,
                      env: { ...process.env, HOME: HOME_DIR, WHATSAPP_MODE: mode },
                      stdio: ["ignore", "pipe", "pipe"],
                    });
                    waPairState.proc = proc;
                    let lineBuf = "";
                    proc.stdout.on("data", async (chunk) => {
                      lineBuf += chunk.toString("utf8");
                      let idx;
                      while ((idx = lineBuf.indexOf("\n")) !== -1) {
                        const rawLine = lineBuf.slice(0, idx).trim();
                        lineBuf = lineBuf.slice(idx + 1);
                        if (!rawLine.startsWith("{")) continue;
                        try {
                          const ev = JSON.parse(rawLine);
                          if (ev.event === "qr" && ev.qr) {
                            waPairState.status = "qr";
                            waPairState.qrSvg = renderQrSvg(ev.qr);
                            waPairState.message = "📲 Scan QR di atas lewat WhatsApp di HP kamu!";
                          } else if (ev.event === "connected") {
                            waPairState.status = "connected";
                            waPairState.qrSvg = "";
                            waPairState.user = ev.user || null;
                            waPairState.message = "✅ WhatsApp BERHASIL TERHUBUNG! Menyimpan sesi AES-256 & menyalakan Gateway...";
                            const envUp = { WHATSAPP_ENABLED: "true", WHATSAPP_MODE: mode };
                            if (allow) envUp.WHATSAPP_ALLOWED_USERS = allow;
                            upsertEnvVars(envUp);
                            await restartHermesGateway();
                            triggerBackgroundSave("chore: auto-save sesi login WhatsApp terenkripsi AES-256");
                            waPairState.message = "🎉 WhatsApp 24/7 AKTIF & terenkripsi AES-256! Kirim pesan di WhatsApp sekarang.";
                          }
                        } catch {}
                      }
                    });
                    proc.on("exit", () => { waPairState.proc = null; });
                  } catch (err) {
                    waPairState.status = "error";
                    waPairState.message = "❌ Gagal memulai WA bridge: " + err.message;
                  }
                });
                return sendJson(res, 200, { ok: true });
              } catch (e) {
                return sendJson(res, 500, { error: e.message });
              }
            }

            if (url.pathname === "/__api/wa/status") {
              return sendJson(res, 200, {
                status: waPairState.status,
                qrSvg: waPairState.qrSvg,
                message: waPairState.message,
                user: waPairState.user,
              });
            }

            if (url.pathname === "/__api/wa/reset" && req.method === "POST") {
              if (waPairState.proc) { try { waPairState.proc.kill("SIGTERM"); } catch {} }
              waPairState = { status: "idle", qrSvg: "", message: "", user: null, proc: null, mode: "self-chat", allow: "" };
              try { fs.rmSync(WA_SESSION_DIR, { recursive: true, force: true }); } catch {}
              upsertEnvVars({ WHATSAPP_ENABLED: "false" });
              await restartHermesGateway();
              triggerBackgroundSave("chore: reset sesi WhatsApp");
              return sendJson(res, 200, { message: "✅ Sesi WhatsApp berhasil diputus & dibersihkan." });
            }

            // 2B. Bot Telegram / Discord Config
            if (url.pathname === "/__api/bot-config" && req.method === "POST") {
              try {
                const data = JSON.parse((await readBody(req)) || "{}");
                const updates = {};
                if (data.telegramToken) updates.TELEGRAM_BOT_TOKEN = String(data.telegramToken).trim();
                if (data.telegramAllow) updates.TELEGRAM_ALLOWED_USERS = String(data.telegramAllow).trim();
                if (data.discordToken) updates.DISCORD_BOT_TOKEN = String(data.discordToken).trim();
                if (data.discordAllow) updates.DISCORD_ALLOWED_USERS = String(data.discordAllow).trim();
                upsertEnvVars(updates);
                await restartHermesGateway(true);
                triggerBackgroundSave("chore: auto-save konfigurasi bot Telegram/Discord terenkripsi");
                return sendJson(res, 200, { message: "✅ Bot Gateway sudah aktif! Silakan kirim pesan ke bot kamu sekarang." });
              } catch (e) {
                return sendJson(res, 500, { error: "Gagal menyimpan Bot config: " + e.message });
              }
            }

            // 3A. Auto-Start Manager (Otomatis Menyala Lintas Sesi 6 Jam!)
            if (url.pathname === "/__api/autostart" && req.method === "POST") {
              try {
                const d = JSON.parse((await readBody(req)) || "{}");
                const cfg = readPanelConfig();
                if (d.action === "add") {
                  const item = {
                    id: crypto.randomBytes(3).toString("hex"),
                    name: String(d.name || "App").trim(),
                    cmd: String(d.cmd || "").trim(),
                    cwd: String(d.cwd || "").trim(),
                    enabled: true,
                  };
                  cfg.autoStarts.push(item);
                  writePanelConfig(cfg);
                  startManagedService(item);
                  triggerBackgroundSave("chore: tambah layanan Auto-Start lintas sesi");
                  return sendJson(res, 200, { message: `✅ "${item.name}" menyala & otomatis jalan di setiap sesi 6 jam berikutnya!` });
                }
                const target = cfg.autoStarts.find((x) => x.id === d.id);
                if (d.action === "start" && target) { target.enabled = true; writePanelConfig(cfg); startManagedService(target); }
                else if (d.action === "stop" && target) { target.enabled = false; writePanelConfig(cfg); stopManagedService(target.id); }
                else if (d.action === "restart" && target) { target.enabled = true; writePanelConfig(cfg); startManagedService(target); }
                else if (d.action === "delete") {
                  stopManagedService(d.id);
                  cfg.autoStarts = cfg.autoStarts.filter((x) => x.id !== d.id);
                  writePanelConfig(cfg);
                  triggerBackgroundSave("chore: hapus layanan Auto-Start");
                }
                return sendJson(res, 200, { ok: true });
              } catch (e) {
                return sendJson(res, 500, { error: e.message });
              }
            }

            // 3B. Custom Domain Permanen (Cloudflare Tunnel Token)
            if (url.pathname === "/__api/cf-domain" && req.method === "POST") {
              try {
                const d = JSON.parse((await readBody(req)) || "{}");
                const cfg = readPanelConfig();
                if (d.domain !== undefined) cfg.cfCustomDomain = String(d.domain || "").trim();
                if (d.token) cfg.cfTunnelToken = String(d.token || "").trim();
                writePanelConfig(cfg);
                startCustomDomainTunnel(cfg.cfTunnelToken);
                triggerBackgroundSave("chore: simpan Cloudflare Custom Domain Tunnel Token terenkripsi");
                return sendJson(res, 200, { message: `✅ Custom Domain Tunnel aktif & otomatis menyala di setiap sesi 6 jam!` });
              } catch (e) {
                return sendJson(res, 500, { error: e.message });
              }
            }

            // 4A. Streaming File Upload dari HP/PC + Auto-Unzip
            if (url.pathname === "/__api/upload" && req.method === "POST") {
              try {
                const rawName = path.basename(url.searchParams.get("name") || `upload-${Date.now()}.bin`);
                const subDir = (url.searchParams.get("dir") || "").replace(/\.\./g, "");
                const autoUnzip = url.searchParams.get("unzip") === "1";
                const destDir = path.resolve(WORKSPACE, subDir || ".");
                if (!destDir.startsWith(path.resolve(WORKSPACE))) {
                  return sendJson(res, 400, { error: "Folder tujuan tidak valid" });
                }
                fs.mkdirSync(destDir, { recursive: true });
                const destPath = path.join(destDir, rawName);
                await new Promise((resolve, reject) => {
                  const ws = fs.createWriteStream(destPath);
                  req.pipe(ws);
                  ws.on("finish", resolve);
                  ws.on("error", reject);
                  req.on("error", reject);
                });
                if (autoUnzip && /\.zip$/i.test(rawName)) {
                  try { execFileSync("unzip", ["-oq", destPath, "-d", destDir], { timeout: 60000 }); } catch {}
                }
                return sendJson(res, 200, { ok: true, path: path.relative(WORKSPACE, destPath) });
              } catch (e) {
                return sendJson(res, 500, { error: "Upload gagal: " + e.message });
              }
            }

            // 4B. 1-Click Publish .apk / Binary ke GitHub Releases (Link Publik Abadi!)
            if (url.pathname === "/__api/release-apk" && req.method === "POST") {
              try {
                const d = JSON.parse((await readBody(req)) || "{}");
                const target = path.resolve(WORKSPACE, String(d.relPath || ""));
                if (!target.startsWith(path.resolve(WORKSPACE) + path.sep) || !fs.existsSync(target)) {
                  return sendJson(res, 404, { error: "File tidak ditemukan." });
                }
                const repo = process.env.GITHUB_REPOSITORY || "";
                if (!repo || !process.env.GH_TOKEN) {
                  return sendJson(res, 400, { error: "GITHUB_REPOSITORY / GH_TOKEN hanya aktif saat berjalan di GitHub Actions." });
                }
                const tag = "hermes-builds";
                try {
                  execFileSync("gh", ["release", "view", tag, "-R", repo], { stdio: "ignore", timeout: 15000 });
                } catch {
                  execFileSync("gh", ["release", "create", tag, "-R", repo, "--title", "Hermes Cloud App Builds", "--notes", "Rilis otomatis dari Hermes Cloud Control Panel v2"], { stdio: "ignore", timeout: 20000 });
                }
                execFileSync("gh", ["release", "upload", tag, target, "--clobber", "-R", repo], { stdio: "ignore", timeout: 120000 });
                const pubUrl = `https://github.com/${repo}/releases/download/${tag}/${encodeURIComponent(path.basename(target))}`;
                return sendJson(res, 200, { url: pubUrl });
              } catch (e) {
                return sendJson(res, 500, { error: "Gagal publish ke GitHub Releases: " + e.message });
              }
            }

            // 5A. Visual Cron Scheduler (Hermes Cron CLI + jobs.json reader)
            if (url.pathname === "/__api/cron") {
              const jobsFile = path.join(HERMES_DIR, "cron", "jobs.json");
              if (req.method === "GET") {
                let jobs = [];
                try {
                  if (fs.existsSync(jobsFile)) {
                    const raw = JSON.parse(fs.readFileSync(jobsFile, "utf8"));
                    const arr = Array.isArray(raw) ? raw : Array.isArray(raw.jobs) ? raw.jobs : Object.values(raw);
                    jobs = arr.map((j) => ({
                      id: j.id || j.job_id || "",
                      name: j.name || "",
                      schedule: typeof j.schedule === "object" ? JSON.stringify(j.schedule) : String(j.schedule || j.cron || j.every || ""),
                      prompt: String(j.prompt || j.message || ""),
                    })).filter((j) => j.id);
                  }
                } catch {}
                return sendJson(res, 200, { jobs });
              }
              if (req.method === "POST") {
                try {
                  const d = JSON.parse((await readBody(req)) || "{}");
                  const hmBin = path.join(HOME_DIR, ".local/bin/hermes");
                  if (d.action === "add") {
                    const args = ["cron", "create", String(d.schedule).trim(), String(d.prompt).trim()];
                    if (d.name) args.push("--name", String(d.name).trim());
                    execFileSync(hmBin, args, { env: { ...process.env, HOME: HOME_DIR }, timeout: 15000 });
                    triggerBackgroundSave("chore: tambah jadwal Cron Hermes");
                    return sendJson(res, 200, { message: "✅ Jadwal otomatis berhasil diaktifkan!" });
                  }
                  if (d.action === "remove" && d.id) {
                    execFileSync(hmBin, ["cron", "remove", String(d.id).trim()], { env: { ...process.env, HOME: HOME_DIR }, timeout: 10000 });
                    triggerBackgroundSave("chore: hapus jadwal Cron Hermes");
                    return sendJson(res, 200, { message: "✅ Jadwal dihapus." });
                  }
                } catch (e) {
                  return sendJson(res, 500, { error: "Gagal mengatur Cron: " + e.message });
                }
              }
            }

            // 5B. Live Log Viewer
            if (url.pathname === "/__api/logs") {
              const src = String(url.searchParams.get("source") || "gateway");
              const map = {
                gateway: "/tmp/hermes-gw.log",
                workspace: "/tmp/hermes-ws.log",
                dashboard: "/tmp/hermes-dash.log",
                tunnel: "/tmp/cf.log",
                "cf-custom": "/tmp/cf-custom.log",
              };
              let logFile = map[src] || "";
              if (src.startsWith("svc:")) {
                const id = src.slice(4).replace(/[^a-z0-9]/gi, "");
                logFile = `/tmp/hm-autostart-${id}.log`;
              }
              let logs = "";
              try {
                if (logFile && fs.existsSync(logFile)) {
                  const raw = fs.readFileSync(logFile, "utf8");
                  logs = raw.split("\n").slice(-100).join("\n");
                }
              } catch {}
              return sendJson(res, 200, { logs });
            }

            // 5C. Clean Cache Disk & RAM
            if (url.pathname === "/__api/clean" && req.method === "POST") {
              try {
                execSync("rm -rf ~/.cache/pip /tmp/hermes-project-*.zip && pnpm store prune >/dev/null 2>&1 || true", { stdio: "ignore", timeout: 30000 });
                return sendJson(res, 200, { message: "🧹 Cache sampah berhasil dibersihkan! Ruang disk kini lebih lega." });
              } catch (e) {
                return sendJson(res, 200, { message: "🧹 Pembersihan selesai." });
              }
            }

            // Status Gabungan untuk Header Telemetry & Semua Tab
            if (url.pathname === "/__api/status") {
              const elapsedMin = Math.floor((Date.now() - START_TIME) / 60000);
              const remainingMin = Math.max(0, DURATION_MIN - elapsedMin);
              let pagesUrl = "";
              try { pagesUrl = fs.readFileSync("/tmp/pages_url.txt", "utf8").trim(); } catch {}
              const tunnels = [];
              for (const [port, info] of previewTunnels.entries()) {
                if (info.url && info.proc && info.proc.exitCode === null) tunnels.push({ port, url: info.url });
              }
              const meta = getHermesMeta();
              const envNow = readEnvMap();
              const cfg = readPanelConfig();
              const aiBusy = await checkGatewayBusy();
              const waCreds = path.join(WA_SESSION_DIR, "creds.json");
              const autoStarts = cfg.autoStarts.map((s) => {
                const runInfo = managedServices.get(s.id);
                let running = false;
                if (runInfo && runInfo.proc && runInfo.proc.pid) {
                  try { process.kill(runInfo.proc.pid, 0); running = true; } catch {}
                }
                return { id: s.id, name: s.name, cmd: s.cmd, cwd: s.cwd, running };
              });
              return sendJson(res, 200, {
                version: cachedVersion,
                remainingMin,
                pagesUrl,
                aiBusy,
                sys: getSystemMetrics(),
                ...meta,
                profiles: cfg.profiles.map((p) => ({ id: p.id, name: p.name, provider: p.provider, model: p.model, reasoning: p.reasoning || "default" })),
                autoStarts,
                cfConfigured: Boolean(cfg.cfTunnelToken || process.env.CF_TUNNEL_TOKEN),
                cfCustomDomain: cfg.cfCustomDomain || "",
                whatsappPaired: fs.existsSync(waCreds),
                telegramConfigured: Boolean(envNow.TELEGRAM_BOT_TOKEN),
                discordConfigured: Boolean(envNow.DISCORD_BOT_TOKEN),
                activePorts: detectActivePorts(),
                tunnels,
                artifacts: scanArtifacts(WORKSPACE),
              });
            }

            if (url.pathname === "/__api/preview" && req.method === "POST") {
              try {
                const body = JSON.parse((await readBody(req)) || "{}");
                const pUrl = await startPortPreviewTunnel(body.port);
                return sendJson(res, 200, { url: pUrl });
              } catch (e) {
                return sendJson(res, 500, { error: e.message });
              }
            }

            if (url.pathname === "/__api/save" && req.method === "POST") {
              try {
                execFileSync(path.join(HOME_DIR, ".local/bin/hermes-save"), ["chore: manual save dari Hermes Cloud Panel v2"], {
                  env: { ...process.env, FINAL_PW: PASSWORD, WORKSPACE_DIR: WORKSPACE },
                  timeout: 60000,
                });
                return sendJson(res, 200, { message: "✅ Berhasil! Seluruh memori, sesi, WA, profil AI & kode sudah terenkripsi ke GitHub." });
              } catch (e) {
                return sendJson(res, 500, { message: "❌ Gagal save: " + e.message });
              }
            }

            if (url.pathname === "/__api/restart" && req.method === "POST") {
              await restartHermesGateway();
              return sendJson(res, 200, { message: "✅ Hermes Gateway sudah aktif kembali!" });
            }

            if (url.pathname === "/__api/zip") {
              const zipFile = `/tmp/hermes-project-${Date.now()}.zip`;
              try {
                execFileSync("zip", ["-rq", zipFile, ".", "-x", ".git/*", "node_modules/*", ".gradle/*", ".hermes-backup.enc"], {
                  cwd: WORKSPACE,
                  timeout: 60000,
                });
                const st = fs.statSync(zipFile);
                res.writeHead(200, {
                  "content-type": "application/zip",
                  "content-length": st.size,
                  "content-disposition": 'attachment; filename="hermes-project.zip"',
                });
                const stream = fs.createReadStream(zipFile);
                stream.pipe(res);
                stream.on("close", () => fs.unlink(zipFile, () => {}));
                return;
              } catch (e) {
                return sendJson(res, 500, { error: "Gagal membuat ZIP: " + e.message });
              }
            }

            if (url.pathname === "/__api/download") {
              const rel = url.searchParams.get("path") || "";
              const target = path.resolve(WORKSPACE, rel);
              if (!target.startsWith(path.resolve(WORKSPACE) + path.sep) || !fs.existsSync(target)) {
                return sendJson(res, 404, { error: "File tidak ditemukan" });
              }
              const st = fs.statSync(target);
              res.writeHead(200, {
                "content-type": "application/octet-stream",
                "content-length": st.size,
                "content-disposition": `attachment; filename="${path.basename(target)}"`,
              });
              return fs.createReadStream(target).pipe(res);
            }

            const prevMatch = url.pathname.match(/^\/preview\/(\d+)(\/.*)?$/);
            if (prevMatch) {
              const appPort = Number(prevMatch[1]);
              const subPath = (prevMatch[2] || "/") + url.search;
              const pReq = http.request(
                { hostname: "127.0.0.1", port: appPort, path: subPath, method: req.method, headers: { ...req.headers, host: `127.0.0.1:${appPort}` } },
                (pRes) => { res.writeHead(pRes.statusCode || 200, pRes.headers); pRes.pipe(res); }
              );
              pReq.on("error", () => {
                res.writeHead(502, { "content-type": "text/plain; charset=utf-8" });
                res.end(`Belum ada web server aktif di port ${appPort}.`);
              });
              return req.pipe(pReq);
            }

            const targetPort = getSurfacePort(req);
            const acceptHdr = String(req.headers.accept || "");
            const isHtmlNav =
              req.method === "GET" &&
              acceptHdr.includes("text/html") &&
              !url.pathname.startsWith("/api/") &&
              !url.pathname.startsWith("/assets/");

            if (isHtmlNav) {
              const cleanHeaders = {
                ...req.headers,
                host: `127.0.0.1:${targetPort}`,
                origin: `http://127.0.0.1:${targetPort}`,
              };
              delete cleanHeaders["accept-encoding"];
              const proxyReq = http.request(
                { hostname: "127.0.0.1", port: targetPort, path: req.url, method: "GET", headers: cleanHeaders },
                (proxyRes) => {
                  const ct = String(proxyRes.headers["content-type"] || "");
                  const outHeaders = { ...proxyRes.headers };
                  delete outHeaders["access-control-allow-origin"];
                  if (!ct.includes("text/html")) {
                    res.writeHead(proxyRes.statusCode || 200, outHeaders);
                    return proxyRes.pipe(res);
                  }
                  const chunks = [];
                  proxyRes.on("data", (c) => chunks.push(c));
                  proxyRes.on("end", () => {
                    let html = Buffer.concat(chunks).toString("utf8");
                    if (html.includes("</head>")) {
                      html = html.replace("</head>", '<script id="__hm_boot_script" src="/__hm_widget.js"></script></head>');
                    } else if (html.includes("</body>")) {
                      html = html.replace("</body>", '<script id="__hm_boot_script" src="/__hm_widget.js"></script></body>');
                    }
                    delete outHeaders["content-length"];
                    res.writeHead(proxyRes.statusCode || 200, outHeaders);
                    res.end(html);
                  });
                }
              );
              proxyReq.on("error", (err) => {
                res.writeHead(502, { "content-type": "text/plain; charset=utf-8" });
                res.end("Hermes sedang menyiapkan antarmuka web (~3 detik), silakan muat ulang halaman: " + err.message);
              });
              return proxyReq.end();
            }

            const upHeaders = {
              ...req.headers,
              host: `127.0.0.1:${targetPort}`,
              origin: `http://127.0.0.1:${targetPort}`,
            };
            const proxyReq = http.request(
              { hostname: "127.0.0.1", port: targetPort, path: req.url, method: req.method, headers: upHeaders },
              (proxyRes) => {
                const outHeaders = { ...proxyRes.headers };
                delete outHeaders["access-control-allow-origin"];
                res.writeHead(proxyRes.statusCode || 200, outHeaders);
                proxyRes.pipe(res);
              }
            );
            proxyReq.on("error", (err) => {
              if (!res.headersSent) res.writeHead(502, { "content-type": "text/plain; charset=utf-8" });
              res.end("Hermes sedang menyala: " + err.message);
            });
            req.pipe(proxyReq);
          });

          server.on("upgrade", (req, socket, head) => {
            if (!isAuthed(req)) {
              socket.write("HTTP/1.1 401 Unauthorized\r\n\r\n");
              socket.destroy();
              return;
            }
            const targetPort = getSurfacePort(req);
            const upUrl = new URL(req.url || "/", "http://localhost");

            // 🖥️ Web Terminal Hermes (ttyd) — WebSocket binary pipe ke :7681 + Basic Auth
            if (upUrl.pathname === "/__tty/ws" || upUrl.pathname.startsWith("/__tty/")) {
              const authB64 = Buffer.from(`hm:${PASSWORD}`).toString("base64");
              const fwd = [
                `GET ${upUrl.pathname}${upUrl.search} HTTP/1.1`,
                `Host: 127.0.0.1:${TTYD_PORT}`,
                `Authorization: Basic ${authB64}`,
              ];
              for (const h of ["connection", "upgrade", "sec-websocket-key", "sec-websocket-version", "sec-websocket-extensions", "sec-websocket-protocol"]) {
                if (req.headers[h]) fwd.push(`${h}: ${req.headers[h]}`);
              }
              const up = net.connect(TTYD_PORT, "127.0.0.1", () => {
                up.write(fwd.join("\r\n") + "\r\n\r\n");
                if (head && head.length) up.write(head);
                socket.pipe(up);
                up.pipe(socket);
              });
              const __ttyKill = () => { try { up.destroy(); } catch {} try { socket.destroy(); } catch {} };
              up.on("error", __ttyKill);
              socket.on("error", __ttyKill);
              up.on("close", () => { try { socket.destroy(); } catch {} });
              socket.on("close", () => { try { up.destroy(); } catch {} });
              return;
            }

            if (upUrl.pathname === "/__hm_sse_ws") {
              const wsKey = req.headers["sec-websocket-key"];
              const ssePath = upUrl.searchParams.get("path") || "/api/events";
              if (!wsKey || !ssePath.startsWith("/")) {
                socket.destroy();
                return;
              }
              const acceptKey = crypto.createHash("sha1").update(wsKey + "258EAFA5-E914-47DA-95CA-C5AB0DC85B11").digest("base64");
              socket.write(
                "HTTP/1.1 101 Switching Protocols\r\n" +
                "Upgrade: websocket\r\n" +
                "Connection: Upgrade\r\n" +
                `Sec-WebSocket-Accept: ${acceptKey}\r\n\r\n`
              );
              const upstreamReq = http.request(
                {
                  hostname: "127.0.0.1",
                  port: targetPort,
                  path: ssePath,
                  method: "GET",
                  headers: {
                    cookie: req.headers.cookie || "",
                    accept: "text/event-stream",
                    host: `127.0.0.1:${targetPort}`,
                    origin: `http://127.0.0.1:${targetPort}`,
                  },
                },
                (upstreamRes) => {
                  sendWsBinary(socket, Buffer.from(": connected\n\n", "utf8"));
                  upstreamRes.on("data", (chunk) => sendWsBinary(socket, Buffer.from(chunk)));
                  upstreamRes.on("end", () => { try { socket.end(); } catch {} });
                  upstreamRes.on("error", () => { try { socket.destroy(); } catch {} });
                }
              );
              upstreamReq.on("error", () => { try { socket.destroy(); } catch {} });
              upstreamReq.end();
              socket.on("data", (frame) => {
                if (frame.length >= 1) {
                  const op = frame[0] & 0x0f;
                  if (op === 0x08) { upstreamReq.destroy(); try { socket.end(); } catch {}; }
                  else if (op === 0x09 && !socket.destroyed) socket.write(Buffer.from([0x8a, 0x00]));
                }
              });
              socket.on("close", () => upstreamReq.destroy());
              socket.on("error", () => upstreamReq.destroy());
              return;
            }

            const upstream = net.connect(targetPort, "127.0.0.1", () => {
              let raw = `${req.method} ${req.url} HTTP/${req.httpVersion}\r\n`;
              for (let i = 0; i < req.rawHeaders.length; i += 2) {
                const k = req.rawHeaders[i];
                const kl = k.toLowerCase();
                const v =
                  kl === "host"
                    ? `127.0.0.1:${targetPort}`
                    : kl === "origin"
                    ? `http://127.0.0.1:${targetPort}`
                    : req.rawHeaders[i + 1];
                raw += `${k}: ${v}\r\n`;
              }
              raw += "\r\n";
              upstream.write(raw);
              if (head && head.length) upstream.write(head);
              socket.pipe(upstream).pipe(socket);
            });
            upstream.on("error", () => socket.destroy());
            socket.on("error", () => upstream.destroy());
          });

          server.listen(LISTEN_PORT, "127.0.0.1");
          PROXYEOF

      - name: 4. Restore Otak Hermes v2, Nyalakan Gateway + Workspace + Dashboard + AutoStart & Publish Link
        env:
          SECRET_PW: ${{ secrets.HERMES_PASSWORD }}
          FALLBACK_PW: ${{ secrets.OPENCODE_PASSWORD }}
          INPUT_PW: ${{ inputs.password_login }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_ALLOWED_USERS: ${{ secrets.DISCORD_ALLOWED_USERS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
          AI_PROVIDER_IN: ${{ inputs.ai_provider }}
          AI_BASE_URL_IN: ${{ inputs.ai_base_url }}
          AI_MODEL_IN: ${{ inputs.ai_model }}
          DURASI: ${{ inputs.durasi_menit }}
        run: |
          export FINAL_PW="$(printf '%s' "${INPUT_PW:-${SECRET_PW:-$FALLBACK_PW}}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          export WORKSPACE_DIR="$PWD"
          if [ -z "$FINAL_PW" ]; then
            echo "::error::Password belum diisi! Isi kolom 'password_login' saat klik Run workflow ATAU buat Secret HERMES_PASSWORD."
            exit 1
          fi
          echo "1" > /tmp/password_verified

          # 1. Pulihkan seluruh memori, sesi chat, WhatsApp session, profil AI, auto-start & .env dari AES-256
          "$HOME/.local/bin/hermes-restore"

          # Jika sebelumnya WhatsApp sudah tertaut, pastikan bridge dependencies siap
          if [ -f "$HOME/.hermes/whatsapp/session/creds.json" ] && [ ! -d "$HOME/.hermes/hermes-agent/scripts/whatsapp-bridge/node_modules" ]; then
            (cd "$HOME/.hermes/hermes-agent/scripts/whatsapp-bridge" && npm install --no-audit --no-fund >/dev/null 2>&1 || true)
          fi

          # 2. Pastikan API Server Gateway :8642 & kredensial GitHub Secrets disuntikkan rapi ke ~/.hermes/.env
          GW_SECRET=$(printf '%s' "$FINAL_PW" | openssl dgst -sha256 -hmac "hermes-internal-gw" | awk '{print $2}')
          echo "$GW_SECRET" > /tmp/gw_secret.txt

          python3 - "$HOME/.hermes/.env" "$GW_SECRET" << 'PYENV'
          import os, sys
          env_file, gw_secret = sys.argv[1:3]
          os.makedirs(os.path.dirname(env_file), exist_ok=True)
          lines = open(env_file, encoding="utf-8").read().splitlines() if os.path.isfile(env_file) else []
          updates = {
              "API_SERVER_ENABLED": "true",
              "API_SERVER_HOST": "127.0.0.1",
              "API_SERVER_PORT": "8642",
              "API_SERVER_KEY": gw_secret,
          }
          for k in [
              "TELEGRAM_BOT_TOKEN", "TELEGRAM_ALLOWED_USERS",
              "DISCORD_BOT_TOKEN", "DISCORD_ALLOWED_USERS",
              "OPENROUTER_API_KEY", "GEMINI_API_KEY",
              "ANTHROPIC_API_KEY", "OPENAI_API_KEY", "NOUS_API_KEY",
          ]:
              v = os.environ.get(k, "").strip()
              if v:
                  updates[k] = v
          seen = set()
          out = []
          for line in lines:
              t = line.strip()
              if t and not t.startswith("#") and "=" in t:
                  k = t.split("=", 1)[0].strip()
                  if k in updates:
                      seen.add(k)
                      out.append(f"{k}={updates[k]}")
                      continue
              out.append(line)
          for k, v in updates.items():
              if k not in seen:
                  out.append(f"{k}={v}")
          open(env_file, "w", encoding="utf-8").write("\n".join(out) + "\n")
          os.chmod(env_file, 0o600)
          PYENV

          # 3. Set direktori kerja terminal + pisahkan port WhatsApp Bridge ke 3099 agar port 3000 bebas untuk Web App!
          "$HOME/.local/bin/hermes" config set terminal.cwd "$WORKSPACE_DIR" >/dev/null 2>&1 || true
          "$HOME/.local/bin/hermes" config set platforms.whatsapp.extra.bridge_port 3099 >/dev/null 2>&1 || true

          if [ "$AI_PROVIDER_IN" = "ollama-free-local" ]; then
            "$HOME/.local/bin/hermes" config set model.provider custom
            "$HOME/.local/bin/hermes" config set model.base_url "http://127.0.0.1:11434/v1"
            "$HOME/.local/bin/hermes" config set model.default "${AI_MODEL_IN:-qwen2.5-coder:3b}"
          elif [ "$AI_PROVIDER_IN" != "unchanged" ]; then
            "$HOME/.local/bin/hermes" config set model.provider "$AI_PROVIDER_IN"
            [ -n "$AI_BASE_URL_IN" ] && "$HOME/.local/bin/hermes" config set model.base_url "$AI_BASE_URL_IN"
            [ -n "$AI_MODEL_IN" ] && "$HOME/.local/bin/hermes" config set model.default "$AI_MODEL_IN"
          fi

          # 4. Konfigurasi koneksi Hermes Workspace (:3002) <-> Hermes Gateway (:8642) & Dashboard (:9119)
          cat << HWENV > /opt/hermes-workspace/.env
          HERMES_AGENT_PATH=$HOME/.hermes/hermes-agent
          HERMES_API_URL=http://127.0.0.1:8642
          HERMES_API_TOKEN=$GW_SECRET
          HERMES_DASHBOARD_URL=http://127.0.0.1:9119
          PORT=3002
          HOST=127.0.0.1
          HWENV

          START_MS=$(date +%s%3N)
          echo "$START_MS" > /tmp/start_ms.txt

          # 5. Nyalakan layanan inti secara paralel (Gateway + Dashboard + Workspace + Cloud Proxy v2 + AutoStart)
          env -u RUNNER_TRACKING_ID \
            nohup "$HOME/.local/bin/hermes" gateway run --replace --accept-hooks </dev/null >/tmp/hermes-gw.log 2>&1 &

          env -u RUNNER_TRACKING_ID \
            nohup "$HOME/.local/bin/hermes" dashboard --host 127.0.0.1 --port 9119 --no-open --skip-build </dev/null >/tmp/hermes-dash.log 2>&1 &

          (
            cd /opt/hermes-workspace
            if [ -f dist/server/server.js ]; then
              env -u RUNNER_TRACKING_ID HOST=127.0.0.1 PORT=3002 \
                nohup node server-entry.js </dev/null >/tmp/hermes-ws.log 2>&1 &
            else
              env -u RUNNER_TRACKING_ID \
                nohup pnpm exec vite dev --host 127.0.0.1 --port 3002 </dev/null >/tmp/hermes-ws.log 2>&1 &
            fi
          )

          # 🖥️ Web Terminal Hermes (ttyd) — akses terminal Linux & CLI hermes dari browser
          mkdir -p "$HOME/.local/bin"
          if [ ! -x "$HOME/.local/bin/ttyd" ]; then
            curl -fsSL --retry 3 --retry-delay 2 -o "$HOME/.local/bin/ttyd" \
              https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 \
              && chmod +x "$HOME/.local/bin/ttyd" \
              || echo "⚠️ ttyd gagal diunduh — fitur Terminal web dilewati (tidak fatal)"
          fi
          cat > /tmp/hermes-term.sh << TERMEOF
          #!/bin/bash
          export HOME="$HOME"
          export PATH="\$HOME/.local/bin:\$PATH"
          cd "$WORKSPACE_DIR" 2>/dev/null || cd "\$HOME"
          export PS1='[hermes \W]\$ '
          export TERM=xterm-256color
          exec bash --noprofile --norc -i
          TERMEOF
          chmod +x /tmp/hermes-term.sh
          if [ -x "$HOME/.local/bin/ttyd" ] && ! curl -fsS -u "hm:$FINAL_PW" http://127.0.0.1:7681/__tty/ >/dev/null 2>&1; then
            env -u RUNNER_TRACKING_ID \
              nohup "$HOME/.local/bin/ttyd" -W -p 7681 -b /__tty -c "hm:$FINAL_PW" -w "$WORKSPACE_DIR" \
              /tmp/hermes-term.sh </dev/null >/tmp/hermes-ttyd.log 2>&1 &
          fi

          env -u RUNNER_TRACKING_ID \
            HERMES_PASSWORD="$FINAL_PW" \
            WORKSPACE_DIR="$WORKSPACE_DIR" \
            START_TIME_MS="$START_MS" \
            DURASI_MENIT="$DURASI" \
            GW_SECRET="$GW_SECRET" \
            GH_TOKEN="$GH_TOKEN" \
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            CF_TUNNEL_TOKEN="$CF_TUNNEL_TOKEN" \
            nohup node /tmp/hermes-proxy.mjs </dev/null >/tmp/hermes-proxy.log 2>&1 &

          for i in $(seq 1 20); do
            if curl -4 -fsS http://127.0.0.1:4096/__hm_health >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          # 6. Buka Cloudflare Tunnel HTTPS Publik & update GitHub Pages + Notif
          env -u RUNNER_TRACKING_ID \
            nohup "$HOME/.local/bin/cloudflared" tunnel --no-autoupdate --protocol http2 --url http://127.0.0.1:4096 </dev/null >/tmp/cf.log 2>&1 &

          URL=""
          for i in $(seq 1 25); do
            URL=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' /tmp/cf.log | head -n 1 || true)
            [ -n "$URL" ] && break
            sleep 1
          done

          if [ -z "$URL" ]; then
            echo "::error::Gagal mendapatkan URL Cloudflare Tunnel."
            cat /tmp/cf.log
            exit 1
          fi

          for i in $(seq 1 20); do
            if curl -4 -fsS "$URL/__hm_health" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          "$HOME/.local/bin/hermes-publish-url" "$URL"
          PAGES_URL=$(cat /tmp/pages_url.txt 2>/dev/null || echo "")
          HM_VER=$("$HOME/.local/bin/hermes" --version 2>/dev/null | head -n 1 || echo "Hermes Agent")

          echo "::notice title=HERMES CLOUD PRO v2 24/7::$URL  |  Link Permanen: $PAGES_URL"

          {
            echo "## ☤ Hermes Agent Cloud Pro v2 24/7 Aktif! (\`$HM_VER\`)"
            echo ""
            echo "| Fitur | Link / Status |"
            echo "| :--- | :--- |"
            echo "| **💬 Hermes Chat Workspace (Modern Web & HP)** | [**$URL/__mode?to=workspace**]($URL/__mode?to=workspace) |"
            echo "| **🎛️ Official Hermes Dashboard (18 Menu Lengkap)** | [**$URL/__mode?to=dashboard**]($URL/__mode?to=dashboard) |"
            echo "| **⚡ Control Panel v2 (AI Profiles, WA QR, AutoStart, Upload & APK)** | [**$URL/__panel**]($URL/__panel) |"
            echo "| **🖥️ Terminal Hermes (CLI & TUI Penuh dari Browser)** | [**$URL/__tty/**]($URL/__tty/) |"
            echo "| **🔗 Link Permanen Seumur Hidup (GitHub Pages)** | [**$PAGES_URL**]($PAGES_URL) |"
            echo "| **🔌 Endpoint API OpenAI-Compatible** | \`$URL/v1\` *(API Key = Password Login)* |"
            echo "| **🛡️ Backup Otomatis Memori, Sesi, WA, Skill & Kode** | Tiap **10 menit** (AES-256 Encrypted · Zero Git Bloat) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 5. Jaga Server Aktif 24/7 + Watchdog Semua Layanan + Auto-Save Tiap 10 Menit
        env:
          SECRET_PW: ${{ secrets.HERMES_PASSWORD }}
          FALLBACK_PW: ${{ secrets.OPENCODE_PASSWORD }}
          INPUT_PW: ${{ inputs.password_login }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DURASI: ${{ inputs.durasi_menit }}
        run: |
          export FINAL_PW="$(printf '%s' "${INPUT_PW:-${SECRET_PW:-$FALLBACK_PW}}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          export WORKSPACE_DIR="$PWD"
          GW_SECRET=$(cat /tmp/gw_secret.txt 2>/dev/null || echo "")
          START_MS=$(cat /tmp/start_ms.txt 2>/dev/null || date +%s%3N)

          AKTIF_URL=$(cat /tmp/current_url.txt 2>/dev/null || echo "")
          PAGES_URL=$(cat /tmp/pages_url.txt 2>/dev/null || echo "")
          echo "========================================================"
          echo "✅ HERMES AGENT CLOUD PRO v2 24/7 AKTIF (BUKAN STUCK!)"
          echo "💬 WEB WORKSPACE     : $AKTIF_URL"
          echo "🔗 LINK PERMANEN     : $PAGES_URL"
          echo "⚡ CONTROL PANEL v2  : $AKTIF_URL/__panel"
          echo "🖥️ TERMINAL HERMES   : $AKTIF_URL/__tty/"
          echo "========================================================"

          TOTAL_DETIK=$(( DURASI * 60 ))
          BERJALAN=0

          while [ "$BERJALAN" -lt "$TOTAL_DETIK" ]; do
            # Watchdog 1: Hermes Gateway (:8642 + WA/Telegram/Discord + Cron)
            if ! curl -fsS -H "Authorization: Bearer $GW_SECRET" http://127.0.0.1:8642/health >/dev/null 2>&1; then
              env -u RUNNER_TRACKING_ID \
                nohup "$HOME/.local/bin/hermes" gateway run --replace --accept-hooks </dev/null >>/tmp/hermes-gw.log 2>&1 &
            fi

            # Watchdog 2: Official Hermes Web Dashboard (:9119)
            if ! curl -fsS http://127.0.0.1:9119/api/status >/dev/null 2>&1; then
              env -u RUNNER_TRACKING_ID \
                nohup "$HOME/.local/bin/hermes" dashboard --host 127.0.0.1 --port 9119 --no-open --skip-build </dev/null >>/tmp/hermes-dash.log 2>&1 &
            fi

            # Watchdog 3: Hermes Workspace Modern UI (:3002)
            if ! curl -fsS http://127.0.0.1:3002 >/dev/null 2>&1; then
              (
                cd /opt/hermes-workspace
                if [ -f dist/server/server.js ]; then
                  env -u RUNNER_TRACKING_ID HOST=127.0.0.1 PORT=3002 \
                    nohup node server-entry.js </dev/null >>/tmp/hermes-ws.log 2>&1 &
                else
                  env -u RUNNER_TRACKING_ID \
                    nohup pnpm exec vite dev --host 127.0.0.1 --port 3002 </dev/null >>/tmp/hermes-ws.log 2>&1 &
                fi
              )
            fi

            # Watchdog 4: Unified Auth & Cloud Panel Proxy v2 (:4096)
            if ! curl -fsS http://127.0.0.1:4096/__hm_health >/dev/null 2>&1; then
              env -u RUNNER_TRACKING_ID \
                HERMES_PASSWORD="$FINAL_PW" \
                WORKSPACE_DIR="$WORKSPACE_DIR" \
                START_TIME_MS="$START_MS" \
                DURASI_MENIT="$DURASI" \
                GW_SECRET="$GW_SECRET" \
                GH_TOKEN="$GH_TOKEN" \
                GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
                CF_TUNNEL_TOKEN="$CF_TUNNEL_TOKEN" \
                nohup node /tmp/hermes-proxy.mjs </dev/null >>/tmp/hermes-proxy.log 2>&1 &
            fi

            # Watchdog 5: Cloudflare HTTPS Tunnel
            if ! pgrep -x "cloudflared" >/dev/null 2>&1; then
              rm -f /tmp/cf.log
              env -u RUNNER_TRACKING_ID \
                nohup "$HOME/.local/bin/cloudflared" tunnel --no-autoupdate --protocol http2 --url http://127.0.0.1:4096 </dev/null >/tmp/cf.log 2>&1 &
              for i in $(seq 1 20); do
                AKTIF_URL=$(grep -o 'https://[-a-z0-9]*\.trycloudflare\.com' /tmp/cf.log | head -n 1 || true)
                [ -n "$AKTIF_URL" ] && break
                sleep 1
              done
              "$HOME/.local/bin/hermes-publish-url" "$AKTIF_URL"
              echo "🔗 LINK BARU DIPUBLIKASIKAN: $AKTIF_URL"
            fi

            # Watchdog 6: Web Terminal Hermes (ttyd :7681)
            if [ -x "$HOME/.local/bin/ttyd" ] && ! curl -fsS -u "hm:$FINAL_PW" http://127.0.0.1:7681/__tty/ >/dev/null 2>&1; then
              [ -x /tmp/hermes-term.sh ] || {
                cat > /tmp/hermes-term.sh << TERMEOF
          #!/bin/bash
          export HOME="$HOME"
          export PATH="\$HOME/.local/bin:\$PATH"
          cd "$WORKSPACE_DIR" 2>/dev/null || cd "\$HOME"
          export PS1='[hermes \W]\$ '
          export TERM=xterm-256color
          exec bash --noprofile --norc -i
          TERMEOF
                chmod +x /tmp/hermes-term.sh
              }
              env -u RUNNER_TRACKING_ID \
                nohup "$HOME/.local/bin/ttyd" -W -p 7681 -b /__tty -c "hm:$FINAL_PW" -w "$WORKSPACE_DIR" \
                /tmp/hermes-term.sh </dev/null >>/tmp/hermes-ttyd.log 2>&1 &
            fi

            sleep 60
            BERJALAN=$(( BERJALAN + 60 ))
            MENIT=$(( BERJALAN / 60 ))
            echo "[Menit ke-$MENIT/$DURASI] Hermes v2 Aktif | Sesi: $AKTIF_URL | Permanen: $PAGES_URL"

            if [ $(( BERJALAN % 600 )) -eq 0 ]; then
              "$HOME/.local/bin/hermes-save" "chore: auto-save memori, sesi, WA & kode Hermes (${MENIT}m)"
            fi
          done

      - name: 6. Simpan Permanen Seluruh Memori, Sesi, WA, Profil AI & Kode Sebelum Ganti Sesi
        if: always()
        env:
          SECRET_PW: ${{ secrets.HERMES_PASSWORD }}
          FALLBACK_PW: ${{ secrets.OPENCODE_PASSWORD }}
          INPUT_PW: ${{ inputs.password_login }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export FINAL_PW="$(printf '%s' "${INPUT_PW:-${SECRET_PW:-$FALLBACK_PW}}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          export WORKSPACE_DIR="$PWD"
          GW_SECRET=$(cat /tmp/gw_secret.txt 2>/dev/null || echo "")

          # Smart Graceful Drain: jika AI sedang aktif bekerja saat waktu sesi habis, tunggu otomatis s/d 7 menit sampai selesai!
          for wait_i in $(seq 1 42); do
            BUSY=$(curl -fsS -H "Authorization: Bearer $GW_SECRET" http://127.0.0.1:8642/health/detailed 2>/dev/null | python3 -c '
          import sys, json
          try:
              j = json.load(sys.stdin)
              r = j.get("readiness") or {}
              print("1" if (j.get("gateway_busy") or j.get("active_agents", 0) > 0 or r.get("active_api_runs", 0) > 0 or r.get("active_delegations", 0) > 0) else "0")
          except Exception:
              print("0")
          ' 2>/dev/null || echo "0")
            [ "$BUSY" != "1" ] && break
            echo "⏳ Hermes AI masih aktif mengerjakan tugas — menunggu selesai dulu sebelum ganti sesi (${wait_i}/42)..."
            sleep 10
          done

          "$HOME/.local/bin/hermes" gateway stop >/dev/null 2>&1 || true
          "$HOME/.local/bin/hermes" dashboard --stop >/dev/null 2>&1 || true
          sleep 2

          "$HOME/.local/bin/hermes-save" "chore: final auto-save otak v2 & project Hermes"

      - name: 7. Lanjut Otomatis Sesi 6 Jam Berikutnya (Self-Healing 24/7 Nonstop)
        if: always() && !cancelled() && inputs.lanjut_otomatis == true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -f /tmp/password_verified ]; then
            echo "Melewati auto-restart karena password belum diisi."
            exit 0
          fi
          for attempt in 1 2 3; do
            if gh workflow run hermes-cloud.yml \
              -f password_login="${{ inputs.password_login }}" \
              -f durasi_menit="${{ inputs.durasi_menit }}" \
              -f lanjut_otomatis=true \
              -f ai_provider=unchanged; then
              echo "✅ Sesi 6 jam Hermes berikutnya berhasil dijadwalkan otomatis!"
              break
            fi
            sleep 5
          done
