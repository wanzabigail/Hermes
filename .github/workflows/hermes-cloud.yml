          function readBody(req, maxBytes = 524288) {
            return new Promise((resolve, reject) => {
              const chunks = [];
              let total = 0;
              req.on("data", (c) => {
                total += c.length;
                if (total > maxBytes) {
                  req.destroy();
                  return reject(new Error("Ukuran data melebihi batas"));
                }
                chunks.push(c);
              });
              req.on("end", () => resolve(Buffer.concat(chunks).toString("utf8")));
              req.on("error", reject);
            });
          }

          function readEnvMap() {
            const map = {};
            try {
              if (!fs.existsSync(ENV_FILE)) return map;
              for (const line of fs.readFileSync(ENV_FILE, "utf8").split("\n")) {
                const t = line.trim();
                if (!t || t.startsWith("#")) continue;
                const eq = t.indexOf("=");
                if (eq > 0) map[t.slice(0, eq).trim()] = t.slice(eq + 1).trim();
              }
            } catch {}
            return map;
          }

          function upsertEnvVars(updates) {
            fs.mkdirSync(HERMES_DIR, { recursive: true });
            let lines = fs.existsSync(ENV_FILE) ? fs.readFileSync(ENV_FILE, "utf8").split("\n") : [];
            const keys = Object.keys(updates);
            const seen = new Set();
            lines = lines.map((line) => {
              const t = line.trim();
              if (!t || t.startsWith("#")) return line;
              const eq = t.indexOf("=");
              if (eq <= 0) return line;
              const k = t.slice(0, eq).trim();
              if (Object.prototype.hasOwnProperty.call(updates, k)) {
                seen.add(k);
                return updates[k] === null ? "" : `${k}=${updates[k]}`;
              }
              return line;
            });
            for (const k of keys) {
              if (!seen.has(k) && updates[k] !== null && updates[k] !== undefined) {
                lines.push(`${k}=${updates[k]}`);
              }
            }
            fs.writeFileSync(ENV_FILE, lines.filter((l, i, arr) => !(l === "" && arr[i - 1] === "")).join("\n") + "\n", { mode: 0o600 });
