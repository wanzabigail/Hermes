                return sendJson(res, 200, { url: pUrl });
              } catch (e) {
                return sendJson(res, 500, { error: e.message });
              }
            }

            if (url.pathname === "/__api/save" && req.method === "POST") {
              try {
                execFileSync(path.join(HOME_DIR, ".local/bin/hermes-save"), ["chore: manual save dari Hermes Cloud Panel"], {
                  env: { ...process.env, FINAL_PW: PASSWORD, WORKSPACE_DIR: WORKSPACE },
                  timeout: 60000,
                });
                return sendJson(res, 200, { message: "✅ Berhasil! Seluruh memori, sesi, skill & kode sudah terenkripsi & tersimpan ke GitHub." });
              } catch (e) {
                return sendJson(res, 500, { message: "❌ Gagal save: " + e.message });
              }
            }

            if (url.pathname === "/__api/restart" && req.method === "POST") {
              await restartHermesGateway();
              return sendJson(res, 200, { message: "✅ Hermes Gateway sudah aktif kembali!" });
            }

            if (url.pathname === "/__api/zip") {
              const zipFile = `/tmp/hermes-project-${Date.now()}.zip`;
              try {
                execFileSync("zip", ["-rq", zipFile, ".", "-x", ".git/*", "node_modules/*", ".gradle/*", ".hermes-backup.enc"], {
                  cwd: WORKSPACE,
                  timeout: 60000,
                });
                const st = fs.statSync(zipFile);
                res.writeHead(200, {
                  "content-type": "application/zip",
                  "content-length": st.size,
                  "content-disposition": 'attachment; filename="hermes-project.zip"',
                });
                const stream = fs.createReadStream(zipFile);
                stream.pipe(res);
                stream.on("close", () => fs.unlink(zipFile, () => {}));
                return;
              } catch (e) {
                return sendJson(res, 500, { error: "Gagal membuat ZIP: " + e.message });
              }
            }

            if (url.pathname === "/__api/download") {
              const rel = url.searchParams.get("path") || "";
              const target = path.resolve(WORKSPACE, rel);
              if (!target.startsWith(path.resolve(WORKSPACE) + path.sep) || !fs.existsSync(target)) {
                return sendJson(res, 404, { error: "File tidak ditemukan" });
              }
              const st = fs.statSync(target);
              res.writeHead(200, {
                "content-type": "application/octet-stream",
                "content-length": st.size,
                "content-disposition": `attachment; filename="${path.basename(target)}"`,
              });
              return fs.createReadStream(target).pipe(res);
            }

            const prevMatch = url.pathname.match(/^\/preview\/(\d+)(\/.*)?$/);
            if (prevMatch) {
              const appPort = Number(prevMatch[1]);
              const subPath = (prevMatch[2] || "/") + url.search;
              const pReq = http.request(
                { hostname: "127.0.0.1", port: appPort, path: subPath, method: req.method, headers: { ...req.headers, host: `127.0.0.1:${appPort}` } },
                (pRes) => { res.writeHead(pRes.statusCode || 200, pRes.headers); pRes.pipe(res); }
              );
              pReq.on("error", () => {
                res.writeHead(502, { "content-type": "text/plain; charset=utf-8" });
                res.end(`Belum ada web server aktif di port ${appPort}.`);
              });
              return req.pipe(pReq);
            }

            // Proxy ke antarmuka aktif: Hermes Workspace (:3002) ATAU Official Hermes Dashboard (:9119)
            const targetPort = getSurfacePort(req);
            const acceptHdr = String(req.headers.accept || "");
            const isHtmlNav =
              req.method === "GET" &&
              acceptHdr.includes("text/html") &&
              !url.pathname.startsWith("/api/") &&
              !url.pathname.startsWith("/assets/");

            if (isHtmlNav) {
              const cleanHeaders = {
                ...req.headers,
                host: `127.0.0.1:${targetPort}`,
                origin: `http://127.0.0.1:${targetPort}`,
              };
              delete cleanHeaders["accept-encoding"];
              const proxyReq = http.request(
                { hostname: "127.0.0.1", port: targetPort, path: req.url, method: "GET", headers: cleanHeaders },
                (proxyRes) => {
                  const ct = String(proxyRes.headers["content-type"] || "");
                  const outHeaders = { ...proxyRes.headers };
                  delete outHeaders["access-control-allow-origin"];
                  if (!ct.includes("text/html")) {
                    res.writeHead(proxyRes.statusCode || 200, outHeaders);
                    return proxyRes.pipe(res);
                  }
                  const chunks = [];
                  proxyRes.on("data", (c) => chunks.push(c));
                  proxyRes.on("end", () => {
                    let html = Buffer.concat(chunks).toString("utf8");
                    if (html.includes("</head>")) {
                      html = html.replace("</head>", '<script id="__hm_boot_script" src="/__hm_widget.js"></script></head>');
                    } else if (html.includes("</body>")) {
                      html = html.replace("</body>", '<script id="__hm_boot_script" src="/__hm_widget.js"></script></body>');
                    }
                    delete outHeaders["content-length"];
                    res.writeHead(proxyRes.statusCode || 200, outHeaders);
                    res.end(html);
                  });
                }
              );
              proxyReq.on("error", (err) => {
                res.writeHead(502, { "content-type": "text/plain; charset=utf-8" });
                res.end("Hermes sedang menyiapkan antarmuka web (~3 detik), silakan muat ulang halaman: " + err.message);
              });
              return proxyReq.end();
            }

            const upHeaders = {
              ...req.headers,
              host: `127.0.0.1:${targetPort}`,
              origin: `http://127.0.0.1:${targetPort}`,
            };
            const proxyReq = http.request(
              { hostname: "127.0.0.1", port: targetPort, path: req.url, method: req.method, headers: upHeaders },
              (proxyRes) => {
                const outHeaders = { ...proxyRes.headers };
                delete outHeaders["access-control-allow-origin"];
                res.writeHead(proxyRes.statusCode || 200, outHeaders);
                proxyRes.pipe(res);
              }
            );
            proxyReq.on("error", (err) => {
              if (!res.headersSent) res.writeHead(502, { "content-type": "text/plain; charset=utf-8" });
              res.end("Hermes sedang menyala: " + err.message);
            });
            req.pipe(proxyReq);
          });

          server.on("upgrade", (req, socket, head) => {
            if (!isAuthed(req)) {
              socket.write("HTTP/1.1 401 Unauthorized\r\n\r\n");
              socket.destroy();
              return;
            }
            const targetPort = getSurfacePort(req);
            const upUrl = new URL(req.url || "/", "http://localhost");

            if (upUrl.pathname === "/__hm_sse_ws") {
              const wsKey = req.headers["sec-websocket-key"];
              const ssePath = upUrl.searchParams.get("path") || "/api/events";
              if (!wsKey || !ssePath.startsWith("/")) {
                socket.destroy();
                return;
              }
              const acceptKey = crypto.createHash("sha1").update(wsKey + "258EAFA5-E914-47DA-95CA-C5AB0DC85B11").digest("base64");
              socket.write(
                "HTTP/1.1 101 Switching Protocols\r\n" +
                "Upgrade: websocket\r\n" +
                "Connection: Upgrade\r\n" +
                `Sec-WebSocket-Accept: ${acceptKey}\r\n\r\n`
              );
              const upstreamReq = http.request(
                {
                  hostname: "127.0.0.1",
                  port: targetPort,
                  path: ssePath,
                  method: "GET",
                  headers: {
                    cookie: req.headers.cookie || "",
                    accept: "text/event-stream",
                    host: `127.0.0.1:${targetPort}`,
                    origin: `http://127.0.0.1:${targetPort}`,
                  },
                },
                (upstreamRes) => {
                  sendWsBinary(socket, Buffer.from(": connected\n\n", "utf8"));
                  upstreamRes.on("data", (chunk) => sendWsBinary(socket, Buffer.from(chunk)));
                  upstreamRes.on("end", () => { try { socket.end(); } catch {} });
                  upstreamRes.on("error", () => { try { socket.destroy(); } catch {} });
                }
              );
              upstreamReq.on("error", () => { try { socket.destroy(); } catch {} });
              upstreamReq.end();
              socket.on("data", (frame) => {
                if (frame.length >= 1) {
                  const op = frame[0] & 0x0f;
                  if (op === 0x08) { upstreamReq.destroy(); try { socket.end(); } catch {}; }
                  else if (op === 0x09 && !socket.destroyed) socket.write(Buffer.from([0x8a, 0x00]));
                }
              });
              socket.on("close", () => upstreamReq.destroy());
              socket.on("error", () => upstreamReq.destroy());
              return;
            }

            const upstream = net.connect(targetPort, "127.0.0.1", () => {
              let raw = `${req.method} ${req.url} HTTP/${req.httpVersion}\r\n`;
              for (let i = 0; i < req.rawHeaders.length; i += 2) {
                const k = req.rawHeaders[i];
                const kl = k.toLowerCase();
                const v =
                  kl === "host"
                    ? `127.0.0.1:${targetPort}`
                    : kl === "origin"
                    ? `http://127.0.0.1:${targetPort}`
                    : req.rawHeaders[i + 1];
                raw += `${k}: ${v}\r\n`;
              }
              raw += "\r\n";
              upstream.write(raw);
              if (head && head.length) upstream.write(head);
              socket.pipe(upstream).pipe(socket);
            });
            upstream.on("error", () => socket.destroy());
            socket.on("error", () => upstream.destroy());
          });

          server.listen(LISTEN_PORT, "127.0.0.1");
          PROXYEOF

      - name: 4. Restore Otak Hermes, Nyalakan Gateway + Workspace + Dashboard & Publish Link
        env:
          SECRET_PW: ${{ secrets.HERMES_PASSWORD }}
          FALLBACK_PW: ${{ secrets.OPENCODE_PASSWORD }}
          INPUT_PW: ${{ inputs.password_login }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_USERS: ${{ secrets.TELEGRAM_ALLOWED_USERS }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_ALLOWED_USERS: ${{ secrets.DISCORD_ALLOWED_USERS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NOUS_API_KEY: ${{ secrets.NOUS_API_KEY }}
