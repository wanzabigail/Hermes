name: Hermes Agent Cloud Pro v2 24/7 (Workspace + Dashboard + WA/TG Bot + AutoStart + AI Profiles)

on:
  workflow_dispatch:
    inputs:
      password_login:
        description: "Password login Web & Enkripsi AES-256 (kosongkan jika sudah pakai Secret HERMES_PASSWORD)"
        required: false
        default: ""
      durasi_menit:
        description: "Durasi per sesi dalam menit (maks 350 = hampir 6 jam)"
        required: true
        default: "350"
      lanjut_otomatis:
        description: "Lanjut otomatis 24 jam nonstop? (Centang agar nyambung terus tiap 6 jam)"
        type: boolean
        required: true
        default: true
      ai_provider:
        description: "Provider AI awal (bisa diganti kapan saja lewat ⚡ Cloud Panel v2 di browser)"
        type: choice
        options:
          - unchanged
          - custom
          - openrouter
          - gemini
          - anthropic
          - nous-api
          - ollama-free-local
        required: true
        default: "unchanged"
      ai_base_url:
        description: "Base URL (khusus Custom OpenAI-Compatible Provider, cth: https://api.domainmu.com/v1)"
        required: false
        default: ""
      ai_model:
        description: "Model ID awal (cth: openrouter/free, gemini-2.5-flash, gpt-4.1 — opsional)"
        required: false
        default: ""

jobs:
  hermes-cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: write
      pages: write
      id-token: write

    steps:
      - name: 1. Ambil Kode Project & Riwayat Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 2. Turbo Cache Runtime Hermes Agent & Hermes Workspace (Boot ~20 Detik!)
        uses: actions/cache@v4
        with:
          path: |
            ~/.hermes/hermes-agent
            ~/.hermes/tools
            ~/.hermes/installs
            ~/.local/bin
            ~/.local/share/pnpm
            /opt/hermes-workspace
          key: hermes-cloud-pro-runtime-v2-${{ runner.os }}

      - name: 3. Install Hermes Agent, Hermes Workspace, Cloud Panel v2 & Helper Backup AES-256
        env:
          AI_PROVIDER_IN: ${{ inputs.ai_provider }}
        run: |
          # Lindungi file workflow agar tidak pernah terhapus tak sengaja oleh agen AI
          cp .github/workflows/hermes-cloud.yml /tmp/protected-hermes-workflow.yml 2>/dev/null || true

          sudo apt-get update -qq && sudo apt-get install -y -qq zip unzip zstd >/dev/null 2>&1 || true
          mkdir -p "$HOME/.local/bin"

          # 1. Install Hermes Agent resmi Nous Research (otomatis dilewati jika sudah ada di Turbo Cache!)
          if [ ! -x "$HOME/.local/bin/hermes" ] || [ ! -d "$HOME/.hermes/hermes-agent" ]; then
            echo "Menginstal Hermes Agent resmi (pertama kali ~1.5 menit, sesi berikutnya instan dari cache)..."
            curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash -s -- --non-interactive --skip-computer-use
          else
            echo "✅ Hermes Agent sudah siap dari Turbo Cache: $($HOME/.local/bin/hermes --version | head -n 1)"
          fi

          export PATH="$HOME/.local/bin:$HOME/.hermes/tools/node/bin:$PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          [ -d "$HOME/.hermes/tools/node/bin" ] && echo "$HOME/.hermes/tools/node/bin" >> "$GITHUB_PATH"

          # Pasang generator QR vektor ringan `segno` (70 KB pure Python) untuk WhatsApp QR di browser
          if [ -x "$HOME/.hermes/hermes-agent/.venv/bin/python" ]; then
            "$HOME/.hermes/hermes-agent/.venv/bin/python" -c "import segno" 2>/dev/null || \
              "$HOME/.local/bin/uv" pip install --python "$HOME/.hermes/hermes-agent/.venv/bin/python" -q segno || \
              pip3 install -q --user segno || true
          else
            pip3 install -q --user segno || true
          fi

          # 2. Install Bun + Cloudflare Tunnel
          if [ ! -x "$HOME/.bun/bin/bun" ]; then
            curl -fsSL https://bun.sh/install | bash >/dev/null 2>&1 || true
          fi
          [ -d "$HOME/.bun/bin" ] && echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

          if [ ! -x "$HOME/.local/bin/cloudflared" ]; then
            curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o "$HOME/.local/bin/cloudflared"
            chmod +x "$HOME/.local/bin/cloudflared"
          fi

          # 3. Install & Pre-Optimize Hermes Workspace v2 (Modern Mobile & Desktop Streaming Chat + Code Editor)
          corepack enable --install-directory "$HOME/.local/bin" || npm install -g pnpm --prefix "$HOME/.local" >/dev/null 2>&1 || true
          sudo mkdir -p /opt/hermes-workspace
          sudo chown -R "$USER:$USER" /opt/hermes-workspace

          if [ ! -f /opt/hermes-workspace/package.json ]; then
            echo "Mengunduh antarmuka web modern Hermes Workspace..."
            git clone -q --depth=1 https://github.com/outsourc-e/hermes-workspace.git /opt/hermes-workspace
          fi
          if [ ! -d /opt/hermes-workspace/node_modules ]; then
            (
              cd /opt/hermes-workspace
              ELECTRON_SKIP_BINARY_DOWNLOAD=1 PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 pnpm install --frozen-lockfile
              pnpm exec vite optimize >/dev/null 2>&1 || true
            )
          fi

          # 4. Opsional: Install Ollama Lokal Gratis jika dipilih tanpa API Key sama sekali
          if [ "$AI_PROVIDER_IN" = "ollama-free-local" ]; then
            if ! command -v ollama >/dev/null 2>&1; then
              curl -fsSL https://ollama.com/install.sh | sh
            fi
            nohup ollama serve >/tmp/ollama.log 2>&1 &
            sleep 3
            ollama pull qwen2.5-coder:3b
          fi

          # 5. Pastikan .gitignore aman (blokir node_modules, build berat, & file rahasia .env dari Git publik!)
          if [ ! -f .gitignore ]; then
            cat << 'GITEOF' > .gitignore
          node_modules/
          .next/
          .nuxt/
          .svelte-kit/
          .gradle/
          **/build/intermediates/
          **/build/tmp/
          __pycache__/
          .venv/
          venv/
          target/debug/
          .hermes-backup.enc
          .env
          .env.*
          !.env.example
          !.env.sample
          !.env.template
          GITEOF
          else
            for rule in ".hermes-backup.enc" ".env" ".env.*" "!.env.example" "!.env.sample"; do
              grep -qxF "$rule" .gitignore 2>/dev/null || echo "$rule" >> .gitignore
            done
          fi

          # Panduan pintar otomatis untuk Hermes Agent (AGENTS.md)
          if [ ! -f AGENTS.md ]; then
            cat << 'AGENTEOF' > AGENTS.md
          # Hermes Agent Cloud Pro v2 24/7 Environment

          Kamu berjalan di server cloud Linux berkapasitas besar (16 GB RAM, 4 vCPU, Ubuntu 24.04) dengan akses internet penuh:
          - **Web & Fullstack:** Node.js, pnpm, Bun, Python 3 (uv), Go, Rust, PHP, Docker & Docker Compose tersedia penuh.
          - **Live Preview & Auto-Start:** Saat menjalankan dev server (Next.js, Vite, Flask, FastAPI, PHP, dll.), SELALU bind ke `0.0.0.0` (cth: `npm run dev -- --host 0.0.0.0 --port 3000`). User bisa membuka link HTTPS publik & mendaftarkannya ke **Auto-Start Lintas Sesi** lewat **⚡ Panel**!
          - **Build Aplikasi Android (.apk):** Java JDK 17/21, Gradle, dan Android SDK lengkap SUDAH TERINSTAL di `$ANDROID_HOME` (`/usr/local/lib/android/sdk`). File `.apk` otomatis muncul di **⚡ Panel → Tab File & APK** lengkap dengan tombol **Download** & **Publish ke GitHub Releases**!
          - **Penyimpanan Permanen 24/7:** Selalu simpan seluruh kode project di dalam folder kerja `$PWD` agar otomatis ter-backup ke GitHub setiap 10 menit. Memori, skill baru (`~/.hermes/skills`), sesi WhatsApp, profil AI, dan riwayat chat (`~/.hermes/state.db`) otomatis terenkripsi AES-256 lintas sesi!
          AGENTEOF
          fi

          # ------------------------------------------------------------------
          # Helper 1A: Simpan Atomic SQLite state.db + WA Session + AI Profiles + Skill + .env (AES-256)
          # ------------------------------------------------------------------
          cat << 'SAVEEOF' > "$HOME/.local/bin/hermes-save"
          #!/usr/bin/env bash
          exec 9>/tmp/hermes-save.lock
          flock -w 90 9 || exit 0

          cd "$WORKSPACE_DIR" || exit 1
          git config user.name "Hermes Cloud Pro" 2>/dev/null || true
          git config user.email "bot@hermes.local" 2>/dev/null || true

          if [ -f /tmp/protected-hermes-workflow.yml ]; then
            mkdir -p .github/workflows
            cp /tmp/protected-hermes-workflow.yml .github/workflows/hermes-cloud.yml
          fi

          STAGE_DIR=$(mktemp -d)
          trap 'rm -rf "$STAGE_DIR"' EXIT

          python3 - "$HOME" "$WORKSPACE_DIR" "$STAGE_DIR" << 'PYEOF'
          import os, sys, json, shutil, sqlite3, subprocess, hashlib

          home_dir, ws_dir, stage_dir = [os.path.realpath(x) for x in sys.argv[1:4]]
          hermes_dir = os.path.join(home_dir, ".hermes")
          out_hermes = os.path.join(stage_dir, "hermes")
          os.makedirs(out_hermes, exist_ok=True)

          skip_heavy = {
              ".git", "node_modules", ".next", ".nuxt", ".svelte-kit",
              ".gradle", "target", ".venv", "venv", "__pycache__", ".cache"
          }

          # 1. Backup selektif seluruh "otak" Hermes (config, .env, cloud_panel.json, OAuth auth.json, SOUL.md,
          #    state.db, sessions, skills, memories, cron, whatsapp session, pairing) TANPA binary 700MB!
          if os.path.isdir(hermes_dir):
              single_files = ["config.yaml", ".env", "auth.json", "SOUL.md", "gateway.json", "cloud_panel.json"]
              for fn in os.listdir(hermes_dir):
                  s_path = os.path.join(hermes_dir, fn)
                  d_path = os.path.join(out_hermes, fn)
                  if os.path.isfile(s_path):
                      if fn.endswith("-wal") or fn.endswith("-shm") or fn.endswith(".lock"):
                          continue
                      try:
                          if fn.endswith(".db"):
                              s_conn = sqlite3.connect(s_path, timeout=15)
                              d_conn = sqlite3.connect(d_path)
                              with d_conn:
                                  s_conn.backup(d_conn)
                              d_conn.close()
                              s_conn.close()
                          elif fn in single_files or fn.endswith((".yaml", ".yml", ".json", ".md")):
                              shutil.copy2(s_path, d_path)
                      except Exception:
                          if os.path.isfile(s_path):
                              try: shutil.copy2(s_path, d_path)
                              except Exception: pass

              keep_dirs = [
                  "memories", "sessions", "skills", "cron", "hooks",
                  "whatsapp", "platforms", "pairing", "skins",
                  "tui-widgets", "desktop-plugins", "profiles"
              ]
              for dname in keep_dirs:
                  s_root = os.path.join(hermes_dir, dname)
                  if not os.path.isdir(s_root):
                      continue
                  for cur, dirs, files in os.walk(s_root):
                      dirs[:] = [d for d in dirs if d not in {"__pycache__", ".git", "node_modules", "logs", "cache"}]
                      rel_c = os.path.relpath(cur, hermes_dir)
                      dst_c = os.path.join(out_hermes, rel_c)
                      os.makedirs(dst_c, exist_ok=True)
                      for f in files:
                          if f.endswith(("-wal", "-shm", ".lock")):
                              continue
                          sf = os.path.join(cur, f)
                          df = os.path.join(dst_c, f)
                          try:
                              if f.endswith(".db"):
                                  sc = sqlite3.connect(sf, timeout=15)
                                  dc = sqlite3.connect(df)
                                  with dc:
                                      sc.backup(dc)
                                  dc.close()
                                  sc.close()
                              elif os.path.isfile(sf) and os.path.getsize(sf) < 25_000_000:
                                  shutil.copy2(sf, df)
                          except Exception:
                              pass

          # 2. Amankan nested `.git` di subfolder project
          for cur, dirs, files in os.walk(ws_dir):
              rel_cur = os.path.relpath(cur, ws_dir)
              if rel_cur == ".":
                  dirs[:] = [d for d in dirs if d not in {".git", "node_modules", ".gradle", ".venv", "venv"}]
                  continue
              if ".git" in dirs:
                  nested_git = os.path.join(cur, ".git")
                  backup_git = os.path.join(cur, ".git_subrepo_saved")
                  try:
                      if os.path.exists(backup_git):
                          shutil.rmtree(backup_git) if os.path.isdir(backup_git) else os.remove(backup_git)
                      shutil.move(nested_git, backup_git)
                      subprocess.run(["git", "-C", ws_dir, "rm", "--cached", "-rf", "--ignore-unmatch", rel_cur],
                                     stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  except Exception:
                      pass
                  dirs.remove(".git")
              dirs[:] = [d for d in dirs if d not in {".git_subrepo_saved", "node_modules", ".gradle", ".venv", "venv"}]

          # 3. Enkripsi seluruh file rahasia `.env` / `.env.*` project agar aman 100% walau memakai Repo Public!
          env_dir = os.path.join(stage_dir, "envs")
          os.makedirs(env_dir, exist_ok=True)
          env_manifest = []
          safe_examples = {".env.example", ".env.sample", ".env.template"}
          for cur, dirs, files in os.walk(ws_dir):
              dirs[:] = [d for d in dirs if d not in skip_heavy and d != ".git_subrepo_saved"]
              for fn in files:
                  if (fn == ".env" or fn.startswith(".env.")) and fn not in safe_examples:
                      full_env = os.path.join(cur, fn)
                      rel_env = os.path.relpath(full_env, ws_dir)
                      key_name = hashlib.sha1(rel_env.encode()).hexdigest()
                      try:
                          shutil.copy2(full_env, os.path.join(env_dir, key_name))
                          env_manifest.append({"rel": rel_env, "key": key_name})
                      except Exception:
                          pass
          with open(os.path.join(stage_dir, "envs.json"), "w", encoding="utf-8") as ef:
              json.dump(env_manifest, ef, indent=2)
          PYEOF

          # 4. Enkripsi AES-256-CBC PBKDF2 ke branch khusus 1-commit `hermes-backup` (0% pembengkakan ukuran Git selamanya!)
          PUSH_REMOTE=""
          if [ -n "$GITHUB_REPOSITORY" ] && [ -n "$GH_TOKEN" ]; then
            PUSH_REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          else
            PUSH_REMOTE=$(git remote get-url origin 2>/dev/null || echo "")
          fi

          if [ -n "$FINAL_PW" ]; then
            TMP_BKP=$(mktemp -d)
            if tar -czf - -C "$STAGE_DIR" . 2>/dev/null \
              | openssl enc -aes-256-cbc -salt -pbkdf2 -pass env:FINAL_PW -out "$TMP_BKP/hermes-backup.enc"; then
              if [ -n "$PUSH_REMOTE" ]; then
                (
                  cd "$TMP_BKP"
                  git init -q -b hermes-backup
                  git config user.name "Hermes Cloud Pro"
                  git config user.email "bot@hermes.local"
                  git add hermes-backup.enc
                  git commit -q -m "chore: encrypted Hermes v2 state snapshot"
                  if git push -f -q "$PUSH_REMOTE" hermes-backup >/dev/null 2>&1; then
                    rm -f "$WORKSPACE_DIR/.hermes-backup.enc"
                  else
                    cp "$TMP_BKP/hermes-backup.enc" "$WORKSPACE_DIR/.hermes-backup.enc"
                  fi
                )
              else
                cp "$TMP_BKP/hermes-backup.enc" "$WORKSPACE_DIR/.hermes-backup.enc"
              fi
            fi
            rm -rf "$TMP_BKP"
          fi

          # 5. Commit & push kode project ke branch utama (tanpa .env rahasia & tanpa file >95MB)
          git add -A 2>/dev/null || true
          git diff --cached --name-only | while IFS= read -r file; do
            base=$(basename "$file")
            if [ "$base" = ".env" ] || { [[ "$base" == .env.* ]] && [ "$base" != ".env.example" ] && [ "$base" != ".env.sample" ] && [ "$base" != ".env.template" ]; }; then
              git rm --cached -f --ignore-unmatch "$file" >/dev/null 2>&1 || true
              continue
            fi
            if [ -f "$file" ]; then
              size=$(wc -c < "$file" 2>/dev/null || echo 0)
              if [ "$size" -gt 99000000 ]; then
                echo "Melewati file >95MB dari git push (tetap bisa diunduh/dirilis lewat Cloud Panel): $file"
                git reset HEAD "$file" >/dev/null 2>&1 || true
              fi
            fi
          done

          if ! git diff --cached --quiet; then
            git commit -m "${1:-chore: auto-save kode project Hermes}" || true
            git pull --rebase --autostash >/dev/null 2>&1 || true
            if [ -n "$PUSH_REMOTE" ]; then
              CUR_BRANCH=$(git rev-parse --abbrev-ref HEAD 2>/dev/null || echo "HEAD")
              git push "$PUSH_REMOTE" "HEAD:${CUR_BRANCH}" >/dev/null 2>&1 || git push >/dev/null 2>&1 || true
            else
              git push >/dev/null 2>&1 || true
            fi
          fi
          SAVEEOF
          chmod +x "$HOME/.local/bin/hermes-save"

          # ------------------------------------------------------------------
          # Helper 1B: Pulihkan Memori, Sesi, WA, Profil AI, AutoStart & .env dari AES-256
          # ------------------------------------------------------------------
          cat << 'RESTOREEOF' > "$HOME/.local/bin/hermes-restore"
          #!/usr/bin/env bash
          cd "$WORKSPACE_DIR" || exit 1
          ENC_FILE=""
          TMP_RES=$(mktemp -d)
          trap 'rm -rf "$TMP_RES"' EXIT

          FETCH_REMOTE=""
          if [ -n "$GITHUB_REPOSITORY" ] && [ -n "$GH_TOKEN" ]; then
            FETCH_REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          else
            FETCH_REMOTE=$(git remote get-url origin 2>/dev/null || echo "")
          fi

          if [ -n "$FETCH_REMOTE" ] && git fetch -q "$FETCH_REMOTE" hermes-backup 2>/dev/null; then
            if git show FETCH_HEAD:hermes-backup.enc > "$TMP_RES/backup.enc" 2>/dev/null && [ -s "$TMP_RES/backup.enc" ]; then
              ENC_FILE="$TMP_RES/backup.enc"
            fi
          fi
          if [ -z "$ENC_FILE" ] && [ -f "$WORKSPACE_DIR/.hermes-backup.enc" ]; then
            ENC_FILE="$WORKSPACE_DIR/.hermes-backup.enc"
          fi

          mkdir -p "$HOME/.hermes" "$TMP_RES/unpack"
          if [ -n "$ENC_FILE" ] && [ -n "$FINAL_PW" ]; then
            echo "Memulihkan otak Hermes v2 (memori, sesi chat, WA, profil AI, auto-start & skill) dari AES-256 ..."
            if openssl enc -d -aes-256-cbc -pbkdf2 -pass env:FINAL_PW -in "$ENC_FILE" 2>/dev/null | tar -xzf - -C "$TMP_RES/unpack" 2>/dev/null; then
              if [ -d "$TMP_RES/unpack/hermes" ]; then
                cp -a "$TMP_RES/unpack/hermes/." "$HOME/.hermes/"
              fi
              echo "✅ Seluruh memori, sesi chat, WhatsApp, profil AI & auto-start berhasil dipulihkan!"
            else
              echo "⚠️ Backup lama menggunakan password berbeda — memulai state Hermes baru."
            fi
          fi

          python3 - "$WORKSPACE_DIR" "$TMP_RES/unpack" << 'PYRESEOF'
          import os, sys, json, shutil
          ws_dir = os.path.realpath(sys.argv[1])
          unpack_dir = sys.argv[2]
          envs_json = os.path.join(unpack_dir, "envs.json")
          if os.path.isfile(envs_json):
              try:
                  for item in json.load(open(envs_json, "r", encoding="utf-8")):
                      src = os.path.join(unpack_dir, "envs", item["key"])
                      dst = os.path.realpath(os.path.join(ws_dir, item["rel"]))
                      if dst.startswith(ws_dir + os.sep) and os.path.isfile(src):
                          os.makedirs(os.path.dirname(dst), exist_ok=True)
                          shutil.copy2(src, dst)
              except Exception:
                  pass
          PYRESEOF
          RESTOREEOF
          chmod +x "$HOME/.local/bin/hermes-restore"

          # ------------------------------------------------------------------
          # Helper 2: Update Link Permanen GitHub Pages + Kirim Notif Telegram/Discord
          # ------------------------------------------------------------------
          cat << 'PUBEOF' > "$HOME/.local/bin/hermes-publish-url"
          #!/usr/bin/env bash
          NEW_URL="$1"
          [ -z "$NEW_URL" ] && exit 0
          echo "$NEW_URL" > /tmp/current_url.txt

          OWNER="${GITHUB_REPOSITORY%/*}"
          REPO="${GITHUB_REPOSITORY#*/}"
          OWNER_LOWER=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          PAGES_URL="https://${OWNER_LOWER}.github.io/${REPO}/"
          echo "$PAGES_URL" > /tmp/pages_url.txt

          if [ -n "$GITHUB_REPOSITORY" ] && [ -n "$GH_TOKEN" ]; then
            TMP_PAGES=$(mktemp -d)
            (
              cd "$TMP_PAGES"
              git init -q -b gh-pages
              git config user.name "Hermes Cloud Pro"
              git config user.email "bot@hermes.local"
              NOW_WIB=$(TZ=Asia/Jakarta date '+%d %b %Y %H:%M WIB')
              cat << HTMLEOF > index.html
          <!doctype html>
          <html lang="id">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <title>Hermes Agent Cloud Pro Redirect</title>
            <meta http-equiv="refresh" content="2;url=${NEW_URL}" />
            <style>
              * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
              body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #090b10; color: #f3f4f6; padding: 18px; text-align: center; }
              .box { width: 100%; max-width: 440px; background: #131722; border: 1px solid #283044; border-radius: 18px; padding: 28px 24px; box-shadow: 0 20px 50px rgba(0,0,0,.55); }
              .badge { display: inline-block; background: #064e3b; color: #6ee7b7; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 999px; margin-bottom: 14px; }
              h1 { margin: 0 0 8px; font-size: 21px; }
              p { margin: 0 0 20px; font-size: 14px; color: #9ca3af; line-height: 1.5; }
              a.btn { display: block; width: 100%; padding: 13px; border-radius: 11px; background: #f59e0b; color: #090b10; text-decoration: none; font-weight: 700; font-size: 15px; margin-bottom: 10px; }
              a.sub { display: block; width: 100%; padding: 11px; border-radius: 11px; background: #1b2130; border: 1px solid #2e374d; color: #e5e7eb; text-decoration: none; font-size: 13px; margin-bottom: 8px; }
              .meta { margin-top: 14px; font-size: 12px; color: #6b7280; }
            </style>
          </head>
          <body>
            <div class="box">
              <div class="badge">☤ HERMES CLOUD PRO v2 AKTIF</div>
              <h1>🚀 Membuka Hermes Workspace...</h1>
              <p>Otomatis berpindah dalam 2 detik. Pilih tampilan langsung di bawah:</p>
              <a class="btn" href="${NEW_URL}/__mode?to=workspace">💬 Buka Hermes Chat Workspace →</a>
              <a class="sub" href="${NEW_URL}/__mode?to=dashboard">🎛️ Buka Official Hermes Dashboard (18 Menu)</a>
              <a class="sub" href="${NEW_URL}/__panel">⚡ Buka Control Panel v2 (AI, WA QR, AutoStart, APK)</a>
              <div class="meta">Diperbarui otomatis: ${NOW_WIB}</div>
            </div>
          </body>
          </html>
          HTMLEOF
              touch .nojekyll
              git add -A
              git commit -q -m "chore: update active Hermes Cloud URL"
              git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages >/dev/null 2>&1 || true
            )
            rm -rf "$TMP_PAGES"

            gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" \
              -f "source[branch]=gh-pages" -f "source[path]=/" >/dev/null 2>&1 || true
          fi

