            fs.appendFileSync(logPath, `\n=== [${new Date().toISOString()}] Starting: ${item.cmd} (cwd: ${safeCwd}) ===\n`);
            const outFd = fs.openSync(logPath, "a");
            const proc = spawn("bash", ["-lc", item.cmd], {
              cwd: safeCwd,
              env: { ...process.env, HOME: HOME_DIR },
              stdio: ["ignore", outFd, outFd],
              detached: true,
            });
            proc.unref();
            managedServices.set(item.id, { proc, logPath, startedAt: Date.now() });
          }

          function stopManagedService(id) {
            const cur = managedServices.get(id);
            if (!cur) return;
            try {
              if (cur.proc && cur.proc.pid) {
                try { process.kill(-cur.proc.pid, "SIGTERM"); } catch { cur.proc.kill("SIGTERM"); }
              }
            } catch {}
            managedServices.delete(id);
          }

          function startCustomDomainTunnel(token) {
            if (customDomainProc) {
              try { customDomainProc.kill("SIGTERM"); } catch {}
              customDomainProc = null;
            }
            const clean = String(token || "").trim();
            if (!clean) return;
            const cfBin = path.join(HOME_DIR, ".local/bin/cloudflared");
            if (!fs.existsSync(cfBin)) return;
            const outFd = fs.openSync("/tmp/cf-custom.log", "a");
            customDomainProc = spawn(cfBin, ["tunnel", "--no-autoupdate", "run", "--token", clean], {
              stdio: ["ignore", outFd, outFd],
              detached: true,
            });
            customDomainProc.unref();
          }

          // Boot Auto-Start services & Custom Domain Tunnel saat server menyala!
          (() => {
            const cfg = readPanelConfig();
            const envToken = (process.env.CF_TUNNEL_TOKEN || cfg.cfTunnelToken || "").trim();
            if (envToken) startCustomDomainTunnel(envToken);
            for (const item of cfg.autoStarts) {
              if (item.enabled !== false && item.cmd) {
                try { startManagedService(item); } catch {}
              }
            }
          })();

          function getSystemMetrics() {
            const totalMemGB = os.totalmem() / (1024 ** 3);
            const availMemGB = os.freemem() / (1024 ** 3);
            const usedMemGB = Math.max(0.1, totalMemGB - availMemGB);
            const ramPct = Math.min(100, Math.round((usedMemGB / totalMemGB) * 100));
            const load1 = os.loadavg()[0] || 0;
            const cpuCores = os.cpus().length || 4;
            const cpuPct = Math.min(100, Math.round((load1 / cpuCores) * 100));
            let diskUsedGB = "0", diskTotalGB = "0", diskPct = 0;
            try {
              const df = execSync("df -BG / | tail -n 1", { encoding: "utf8" }).trim().split(/\s+/);
              diskTotalGB = df[1].replace("G", "");
              diskUsedGB = df[2].replace("G", "");
              diskPct = parseInt(df[4], 10) || 0;
            } catch {}
            return {
              cpuPct,
              ramText: `${usedMemGB.toFixed(1)}/${totalMemGB.toFixed(0)} GB`,
              ramPct,
              diskText: `${diskUsedGB}/${diskTotalGB} GB`,
              diskPct,
            };
          }

          function getHermesMeta() {
            const info = { sessionCount: 0, skillCount: 0, memoryCount: 0, provider: "-", model: "-", baseUrl: "", reasoning: "default" };
            try {
              const py = [
                "import sys, os, json, sqlite3, yaml",
                "hdir = sys.argv[1]",
                "out = {'sessionCount': 0, 'skillCount': 0, 'memoryCount': 0, 'provider': 'auto', 'model': '-', 'baseUrl': '', 'reasoning': 'default'}",
                "cfg_f = os.path.join(hdir, 'config.yaml')",
                "if os.path.isfile(cfg_f):",
                "  c = yaml.safe_load(open(cfg_f, encoding='utf-8')) or {}",
                "  m = c.get('model') or {}",
                "  if isinstance(m, dict):",
                "    out['provider'] = str(m.get('provider') or 'auto')",
                "    out['model'] = str(m.get('default') or m.get('model') or '-')",
                "    out['baseUrl'] = str(m.get('base_url') or '')",
                "    eff = (c.get('agent') or {}).get('reasoning_effort')",
                "    if isinstance(eff, str) and eff: out['reasoning'] = eff",
                "    try:",
                "      ovd = (c.get('model_overrides') or {}).get(out['provider']) or {}",
                "      for mk in (out['model'], '_default'):",
                "          ov = ovd.get(mk) if isinstance(ovd, dict) else None",
                "          if isinstance(ov, dict) and ov.get('supports_reasoning') is False: out['reasoning'] = 'off'",
                "    except Exception: pass",
                "db_f = os.path.join(hdir, 'state.db')",
                "if os.path.isfile(db_f):",
                "  conn = sqlite3.connect(db_f, timeout=4)",
                "  for tbl in ('sessions', 'session'):",
                "    try:",
                "      out['sessionCount'] = conn.execute(f'SELECT COUNT(*) FROM {tbl}').fetchone()[0]; break",
                "    except Exception: pass",
                "sk_d = os.path.join(hdir, 'skills')",
                "if os.path.isdir(sk_d):",
                "  out['skillCount'] = sum(1 for _, _, fs_l in os.walk(sk_d) if 'SKILL.md' in fs_l)",
                "mem_d = os.path.join(hdir, 'memories')",
                "if os.path.isdir(mem_d):",
                "  out['memoryCount'] = len([x for x in os.listdir(mem_d) if not x.startswith('.')])",
                "print(json.dumps(out))",
              ].join("\n");
              Object.assign(info, JSON.parse(execFileSync(PY_BIN, ["-c", py, HERMES_DIR], { encoding: "utf8", timeout: 4000 }).trim()));
            } catch {}
            return info;
          }

          function scanArtifacts(dir, depth = 0, out = []) {
            if (depth > 6) return out;
            let entries = [];
            try { entries = fs.readdirSync(dir, { withFileTypes: true }); } catch { return out; }
            for (const e of entries) {
              if ([".git", "node_modules", ".gradle", ".cache"].includes(e.name)) continue;
              const full = path.join(dir, e.name);
              if (e.isDirectory()) {
                scanArtifacts(full, depth + 1, out);
              } else if (/\.(apk|aab|ipa|exe|AppImage)$/i.test(e.name)) {
                try {
                  const st = fs.statSync(full);
                  out.push({
                    name: e.name,
                    relPath: path.relative(WORKSPACE, full),
                    sizeMB: (st.size / (1024 * 1024)).toFixed(2),
                    mtime: st.mtimeMs,
                  });
                } catch {}
              }
            }
            return out.sort((a, b) => b.mtime - a.mtime);
          }

          function detectActivePorts() {
            try {
              const raw = execSync("ss -tlnH 2>/dev/null || true", { encoding: "utf8" });
              const ignored = new Set([22, LISTEN_PORT, WS_UI_PORT, DASH_PORT, GW_API_PORT, 3099, 11434, 20241]);
              const found = new Set();
              for (const line of raw.split("\n")) {
                const m = line.match(/:(\d+)\s+/);
                if (m) {
                  const p = Number(m[1]);
                  if (p >= 1024 && p < 32768 && !ignored.has(p)) found.add(p);
                }
              }
              return Array.from(found).sort((a, b) => a - b);
            } catch {
              return [];
            }
          }

          async function startPortPreviewTunnel(port) {
            const p = Number(port);
            if (!p || p < 1 || p > 65535) throw new Error("Port tidak valid");
            const existing = previewTunnels.get(p);
            if (existing && existing.url && existing.proc && existing.proc.exitCode === null) {
              return existing.url;
            }
            const cfBin = path.join(HOME_DIR, ".local/bin/cloudflared");
            const proc = spawn(cfBin, ["tunnel", "--no-autoupdate", "--protocol", "http2", "--url", `http://127.0.0.1:${p}`], {
              stdio: ["ignore", "pipe", "pipe"],
            });
            let logs = "";
            const url = await new Promise((resolve, reject) => {
              const timer = setTimeout(() => reject(new Error("Timeout membuat tunnel preview")), 20000);
              const onChunk = (buf) => {
                logs += buf.toString();
                const m = logs.match(/https:\/\/[-a-z0-9]+\.trycloudflare\.com/);
                if (m) { clearTimeout(timer); resolve(m[0]); }
              };
              proc.stdout.on("data", onChunk);
              proc.stderr.on("data", onChunk);
              proc.on("exit", () => { previewTunnels.delete(p); clearTimeout(timer); reject(new Error("Cloudflared berhenti")); });
            });
            previewTunnels.set(p, { url, proc });
            return url;
          }

          function httpJsonRequest(fullUrl, { method = "GET", headers = {}, body = null, timeoutMs = 12000 } = {}) {
            return new Promise((resolve, reject) => {
              const u = new URL(fullUrl);
              const lib = u.protocol === "https:" ? https : http;
              const req = lib.request(
                u,
                { method, headers, timeout: timeoutMs },
                (res) => {
                  const chunks = [];
                  res.on("data", (c) => chunks.push(c));
                  res.on("end", () => {
                    const txt = Buffer.concat(chunks).toString("utf8");
                    resolve({ status: res.statusCode || 0, text: txt });
                  });
                }
              );
              req.on("error", reject);
              req.on("timeout", () => { req.destroy(); reject(new Error("Timeout koneksi ke server AI")); });
              if (body) req.write(body);
              req.end();
            });
          }

