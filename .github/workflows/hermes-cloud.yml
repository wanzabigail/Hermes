            <script>
              document.getElementById('remote-ep').textContent = location.origin + '/v1';

              // Navigasi Tab super ringan
              document.querySelectorAll('.tab').forEach(btn => {
                btn.addEventListener('click', () => {
                  document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
                  document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
                  btn.classList.add('active');
                  document.getElementById(btn.dataset.tab).classList.add('active');
                  if (btn.dataset.tab === 'p-sys') { loadLogs(); loadCrons(); }
                });
              });

              const defUrls = {
                openrouter: 'https://openrouter.ai/api/v1',
                gemini: 'https://generativelanguage.googleapis.com/v1beta/openai',
                'nous-api': 'https://inference-api.nousresearch.com/v1',
                huggingface: 'https://router.huggingface.co/v1',
              };
              function onProvChange() {
                const p = document.getElementById('ai-prov').value;
                if (defUrls[p]) document.getElementById('ai-url').value = defUrls[p];
              }

              async function fetchModels() {
                const msg = document.getElementById('ai-msg');
                msg.textContent = '⏳ Mengambil daftar model dari server AI...';
                const r = await fetch('/__api/ai-models', {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({
                    provider: document.getElementById('ai-prov').value,
                    baseUrl: document.getElementById('ai-url').value.trim(),
                    apiKey: document.getElementById('ai-key').value.trim(),
                    userAgent: document.getElementById('ai-ua').value.trim(),
                  }),
                });
                const d = await r.json();
                if (d.models && d.models.length) {
                  const sel = document.getElementById('ai-model-sel');
                  sel.style.display = 'block';
                  sel.innerHTML = d.models.map(m => '<option value="' + m.replace(/"/g, '&quot;') + '">' + m + '</option>').join('');
                  if (!document.getElementById('ai-model').value) document.getElementById('ai-model').value = d.models[0];
                  msg.textContent = '✅ Ditemukan ' + d.models.length + ' model! Pilih dari dropdown di atas.';
                } else {
                  msg.textContent = '❌ ' + (d.error || 'Tidak ada daftar model yang dikembalikan.');
                }
              }

              async function pingAi() {
                const msg = document.getElementById('ai-msg');
                msg.textContent = '⏳ Menguji koneksi: tes dasar → simulasi request asli Hermes (tools + reasoning)...';
                const r = await fetch('/__api/ai-ping', {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({
                    provider: document.getElementById('ai-prov').value,
                    baseUrl: document.getElementById('ai-url').value.trim(),
                    apiKey: document.getElementById('ai-key').value.trim(),
                    model: document.getElementById('ai-model').value.trim(),
                    userAgent: document.getElementById('ai-ua').value.trim(),
                  }),
                });
                const d = await r.json();
                msg.textContent = d.message || d.error;
                const fixBtn = document.getElementById('ai-fix-btn');
                if (fixBtn) fixBtn.style.display = d.fixReasoning ? 'block' : 'none';
              }

              async function autoFixReasoning() {
                document.getElementById('ai-reason').value = 'off';
                document.getElementById('ai-fix-btn').style.display = 'none';
                await saveAiConfig(false);
              }

              async function runForensic() {
                const msg = document.getElementById('ai-msg');
                const fout = document.getElementById('forensic-out');
                msg.textContent = '⏳ Forensik berjalan: membaca dump request asli + tes bertahap (bisa 30-90 detik, jangan tutup tab)...';
                fout.textContent = '';
                try {
                  const r = await fetch('/__api/ai-forensic', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({
                      provider: document.getElementById('ai-prov').value,
                      baseUrl: document.getElementById('ai-url').value.trim(),
                      apiKey: document.getElementById('ai-key').value.trim(),
                      model: document.getElementById('ai-model').value.trim(),
                      userAgent: document.getElementById('ai-ua').value.trim(),
                    }),
                  });
                  const d = await r.json();
                  const lines = [];
                  if (d.dump) {
                    lines.push('📄 REQUEST ASLI YANG DITOLAK HERMES:');
                    lines.push('   Waktu : ' + d.dump.time + ' UTC');
                    lines.push('   Model : ' + d.dump.model);
                    lines.push('   Isi   : ' + d.dump.messages + ' pesan · ' + d.dump.tools + ' tools · ' + d.dump.sizeKB + ' KB' + (d.dump.images ? ' · ' + d.dump.images + ' gambar' : ''));
                    lines.push('   Param extra : ' + (d.dump.extraKeys && d.dump.extraKeys.length ? d.dump.extraKeys.join(', ') : '(tidak ada)'));
                    if (d.dump.reasoningSent) lines.push('   ⚠️ reasoning_effort MASIH TERKIRIM: ' + d.dump.reasoningSent);
                    lines.push('   Error : HTTP ' + d.dump.errorStatus + ' — ' + d.dump.errorMessage);
                    lines.push('');
                  }
                  if (d.stages && d.stages.length) {
                    lines.push('🧪 TES BERTAHAP LIVE:');
                    for (const s of d.stages) lines.push('   ' + (s.ok === null ? '➖' : s.ok ? '✅' : '❌') + ' ' + s.label + (s.ok ? '' : '  [HTTP ' + s.status + (s.detail ? ': ' + s.detail : '') + ']'));
                    lines.push('');
                  }
                  lines.push('🔎 KESIMPULAN:');
                  lines.push(d.verdict || '-');
                  fout.textContent = lines.join('\\n');
                  msg.textContent = '✅ Forensik selesai — baca kesimpulan di bawah.';
                  const fixBtn = document.getElementById('ai-fix-btn');
                  if (fixBtn) fixBtn.style.display = d.fixReasoning ? 'block' : 'none';
                  const mtBtn = document.getElementById('mt-fix-btn');
                  if (mtBtn) mtBtn.style.display = d.fixMaxTokens ? 'block' : 'none';
                } catch (e) {
                  msg.textContent = '❌ Forensik gagal: ' + e.message;
                }
              }

              async function autoFixMaxTokens() {
                const msg = document.getElementById('ai-msg');
                msg.textContent = '⏳ Menerapkan max_output_tokens 4096 & restart Gateway...';
                const r = await fetch('/__api/ai-config', {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({
                    provider: document.getElementById('ai-prov').value,
                    baseUrl: document.getElementById('ai-url').value.trim(),
                    apiKey: document.getElementById('ai-key').value.trim(),
                    model: document.getElementById('ai-model').value.trim(),
                    userAgent: document.getElementById('ai-ua').value.trim(),
                    reasoning: document.getElementById('ai-reason').value,
                    maxOutputTokens: 4096,
                  }),
                });
                const d = await r.json();
                msg.textContent = d.message || d.error;
                document.getElementById('mt-fix-btn').style.display = 'none';
                loadStatus();
              }

              async function saveAiConfig(saveProfile) {
                const payload = {
                  provider: document.getElementById('ai-prov').value,
                  baseUrl: document.getElementById('ai-url').value.trim(),
                  apiKey: document.getElementById('ai-key').value.trim(),
                  model: document.getElementById('ai-model').value.trim(),
                  userAgent: document.getElementById('ai-ua').value.trim(),
                  reasoning: document.getElementById('ai-reason').value,
                  profileName: saveProfile ? (document.getElementById('ai-prof-name').value.trim() || (document.getElementById('ai-prov').value + ' - ' + document.getElementById('ai-model').value.trim())) : '',
                };
                const msg = document.getElementById('ai-msg');
                msg.textContent = '⏳ Menyimpan konfigurasi AI & menyalakan ulang Gateway...';
                const r = await fetch('/__api/ai-config', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) });
                const d = await r.json();
                msg.textContent = d.message || d.error;
                loadStatus();
              }

              async function activateProfile(id) {
                const msg = document.getElementById('ai-msg');
                msg.textContent = '⏳ Mengaktifkan profil AI...';
                const r = await fetch('/__api/ai-profiles', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'activate', id }) });
                const d = await r.json();
                msg.textContent = d.message || d.error;
                loadStatus();
              }

              async function deleteProfile(id) {
                await fetch('/__api/ai-profiles', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'delete', id }) });
                loadStatus();
              }

              // WhatsApp QR Polling
              let waTimer = null;
              async function startWaPair() {
                document.getElementById('wa-msg').textContent = '⏳ Menyiapkan jembatan WhatsApp & mengambil QR Code...';
                await fetch('/__api/wa/start', {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({
                    mode: document.getElementById('wa-mode').value,
                    allow: document.getElementById('wa-allow').value.trim(),
                  }),
                });
                if (waTimer) clearInterval(waTimer);
                waTimer = setInterval(pollWaStatus, 2000);
                pollWaStatus();
              }

              async function pollWaStatus() {
                const r = await fetch('/__api/wa/status');
                const d = await r.json();
                const area = document.getElementById('wa-qr-area');
                const msg = document.getElementById('wa-msg');
                if (d.qrSvg && d.status === 'qr') {
                  area.innerHTML = '<div class="qr-box">' + d.qrSvg + '</div>';
                  msg.textContent = '📲 Buka WhatsApp di HP → Perangkat Tertaut → Tautkan Perangkat → Scan QR di atas!';
                } else {
                  area.innerHTML = '';
                  if (d.message) msg.textContent = d.message;
                }
                if (d.status === 'connected') {
                  if (waTimer) { clearInterval(waTimer); waTimer = null; }
                  loadStatus();
                }
              }

              async function resetWa() {
                const r = await fetch('/__api/wa/reset', { method: 'POST' });
                const d = await r.json();
                document.getElementById('wa-qr-area').innerHTML = '';
                document.getElementById('wa-msg').textContent = d.message || 'Sesi WA direset.';
                loadStatus();
              }

              async function saveBotConfig() {
                const msg = document.getElementById('bot-msg');
                msg.textContent = '⏳ Menyimpan token Bot & menyalakan ulang Gateway...';
                const r = await fetch('/__api/bot-config', {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({
                    telegramToken: document.getElementById('tg-tok').value.trim(),
                    telegramAllow: document.getElementById('tg-allow').value.trim(),
                    discordToken: document.getElementById('dc-tok').value.trim(),
                    discordAllow: document.getElementById('dc-allow').value.trim(),
                  }),
                });
                const d = await r.json();
                msg.textContent = d.message || d.error;
                loadStatus();
              }

              // Auto-Start Manager
              async function addAutoStart() {
                const name = document.getElementById('as-name').value.trim() || 'Layanan App';
                const cmd = document.getElementById('as-cmd').value.trim();
                const cwd = document.getElementById('as-cwd').value.trim();
                if (!cmd) return (document.getElementById('as-msg').textContent = '❌ Isi perintah start terlebih dulu.');
                const r = await fetch('/__api/autostart', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'add', name, cmd, cwd }) });
                const d = await r.json();
                document.getElementById('as-msg').textContent = d.message || 'Tersimpan!';
                document.getElementById('as-cmd').value = '';
                loadStatus();
              }

              async function actAutoStart(action, id) {
                await fetch('/__api/autostart', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action, id }) });
                if (action === 'log') {
                  document.querySelector('[data-tab="p-sys"]').click();
                  const sel = document.getElementById('log-src');
                  if (![...sel.options].some(o => o.value === 'svc:' + id)) {
                    const opt = document.createElement('option');
                    opt.value = 'svc:' + id;
                    opt.textContent = 'AutoStart Log (' + id + ')';
                    sel.appendChild(opt);
                  }
                  sel.value = 'svc:' + id;
                  loadLogs();
                  return;
                }
                loadStatus();
              }

              async function saveCfDomain() {
                const msg = document.getElementById('cf-msg');
                msg.textContent = '⏳ Menyimpan & menyambungkan Cloudflare Custom Domain Tunnel...';
                const r = await fetch('/__api/cf-domain', {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify({
                    domain: document.getElementById('cf-domain').value.trim(),
                    token: document.getElementById('cf-token').value.trim(),
                  }),
                });
                const d = await r.json();
                msg.textContent = d.message || d.error;
                loadStatus();
              }

              async function openPreview() {
                const port = document.getElementById('port-in').value;
                const msg = document.getElementById('as-msg');
                msg.textContent = '⏳ Membuat link HTTPS publik untuk port ' + port + '...';
                const r = await fetch('/__api/preview', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ port }) });
                const d = await r.json();
                if (d.url) {
                  msg.innerHTML = '✅ Live Preview aktif: <a style="color:#6ee7b7" target="_blank" href="' + d.url + '">' + d.url + '</a>';
                  loadStatus();
                  window.open(d.url, '_blank');
                } else {
                  msg.textContent = '❌ ' + (d.error || 'Gagal membuat tunnel');
                }
              }

              function openSubpath() {
                window.open('/preview/' + document.getElementById('port-in').value + '/', '_blank');
              }

              // Upload Multi-File + Progress Bar
              async function uploadFiles() {
                const input = document.getElementById('up-files');
                if (!input.files.length) return (document.getElementById('up-msg').textContent = '❌ Pilih minimal 1 file dulu.');
                const sub = document.getElementById('up-dir').value.trim();
                const unzip = document.getElementById('up-unzip').checked ? '1' : '0';
                const barWrap = document.getElementById('up-bar-wrap');
                const bar = document.getElementById('up-bar');
                const msg = document.getElementById('up-msg');
                barWrap.style.display = 'block';

                let done = 0;
                for (const file of input.files) {
                  await new Promise((resolve) => {
                    const xhr = new XMLHttpRequest();
                    xhr.open('POST', '/__api/upload?name=' + encodeURIComponent(file.name) + '&dir=' + encodeURIComponent(sub) + '&unzip=' + unzip);
                    xhr.upload.onprogress = (e) => {
