                  <div class="row">
                    <button type="button" class="green" onclick="doAction('/__api/save','Mengenkripsi & menyimpan seluruh state ke GitHub...')">💾 Save Sekarang</button>
                    <button type="button" class="amber" onclick="doAction('/__api/restart','Me-restart Hermes Gateway...')">🔄 Restart Gateway</button>
                    <button type="button" class="ghost" onclick="doAction('/__api/clean','Membersihkan cache sampah disk & RAM...')">🧹 Bersihkan Cache</button>
                  </div>
                  <div class="msg" id="act-msg"></div>
                </div>
